window.addEventListener("resize",function(){var w=window.innerWidth;if(Math.abs(w-_lw)>40){_lw=w;buildScene()}renderGarden();if(EDIT)editDraw()});
function sessKey(g){return g.kind==="level"?"l"+g.id:g.kind==="boss"?"boss":g.kind==="exam"?"x"+g.i0:g.kind==="exmix"?"xmix":"rev"}
function curKey(){return cur.kind==="level"?"l"+LEVELS[cur.i].id:cur.kind==="boss"?"boss":cur.kind==="exam"?"x"+cur.i:"xmix"}
function snap(){var g=G;return{ts:Date.now(),stage:view==="result"?"result":"quiz",kind:g.kind,i0:g.i0,id:g.id,label:g.label,qs:g.qs,i:g.i,correct:g.correct,hints:g.hints,picked:g.picked,hintOn:!!g.hintOn,cutOn:!!g.cutOn,total:g.total,carry:g.carry||0,round:g.round||1,missed:g.missed||[],earned:g.earned||0,startTotal:g.startTotal,log:g.log||[],res:g.res||null,revealed:!!g.revealed,animDone:!!g.animDone,next:g.next===undefined?null:g.next}}
function keepResult(){return G.kind!=="review"&&G.res&&((G.missed&&G.missed.length>0)||(G.res.firstClear&&!G.revealed))}
function persistSess(){
 if(!G)return;if(!S.sess)S.sess={};var k=sessKey(G);
 if(view==="quiz")S.sess[k]=snap();
 else if(view==="result"){if(keepResult())S.sess[k]=snap();else delete S.sess[k]}
 var ks=Object.keys(S.sess);if(ks.length>8){ks.sort(function(a,b){return(S.sess[a].ts||0)-(S.sess[b].ts||0)});while(ks.length>8)delete S.sess[ks.shift()]}
 save();
}
function sessCard(k){
 var sn=S.sess&&S.sess[k];if(!sn)return "";
 var sec=(sn.kind==="exam"||sn.kind==="exmix")?"Practice Exam A":(sn.kind==="review"?"Pop quiz":"Section 7"),line,pri,act,m=(sn.missed||[]).length;
 if(sn.stage==="result"){
  var pend=sn.res&&sn.res.firstClear&&!sn.revealed&&sn.kind!=="review";
  line=pend?"Your new reward is waiting":(sn.res&&sn.res.pass?"Cleared":"Not cleared yet")+(m?" · "+m+" to "+(sn.res&&sn.res.pass?"practice":"retake"):"");
  if(pend){pri="See my reward";act="sresume"}else if(m){pri=(sn.res&&sn.res.pass?"Practice the ":"Retake the ")+m+" I missed";act="sretake"}else{pri="Open results";act="sresume"}
 }else{
  var ans=0;(sn.log||[]).forEach(function(x){if(x===0||x===1)ans++});
  line=ans+" of "+sn.qs.length+" answered";pri="Continue";act="sresume";
 }
 return '<div class="sess"><b>'+esc(sn.label)+'</b><small>'+sec+' · '+esc(line)+'</small><div class="row"><button class="btn" data-a="'+act+'" data-k="'+k+'">'+esc(pri)+'</button><button class="gbtn" data-a="sfresh" data-k="'+k+'">Start fresh</button><button class="link" data-a="sdis" data-k="'+k+'">Dismiss</button></div></div>';
}
function sessList(){
 var ks=Object.keys(S.sess||{});if(!ks.length)return "";
 ks.sort(function(a,b){return(S.sess[b].ts||0)-(S.sess[a].ts||0)});
 var h='<h2 class="sec" style="margin-top:0">Pick up where you left off</h2>';
 ks.slice(0,3).forEach(function(k){h+=sessCard(k)});
 if(ks.length>3)h+='<p style="font-size:12.5px;color:var(--ink2);margin:0 0 10px">'+(ks.length-3)+' more saved. Open a trail to see them.</p>';
 return h;
}
function introRow(){var k=curKey(),has=S.sess&&S.sess[k];return(has?sessCard(k):"")+'<div class="row">'+(has?"":'<button class="btn" data-a="start">Start foraging</button>')+'<button class="gbtn" data-a="home">Back to the trail</button></div>'}
function resumeSess(sn,retake){
 G=JSON.parse(JSON.stringify(sn));var st=G.stage;delete G.ts;delete G.stage;
 G.log=G.log||[];G.missed=G.missed||[];cur={kind:G.kind,i:G.i0};
 if(retake){startRetake();return}
 setView(st==="result"?"result":"quiz");
}
var EDIT=null,_drag=null;
function winSize(){var el=document.getElementById("gard"),r=(el&&el.getBoundingClientRect)?el.getBoundingClientRect():null;return{W:(r&&r.width)||window.innerWidth||390,H:(r&&r.height)||window.innerHeight||800}}
function gscale(W){return Math.min(380,W*.96)/304}
function gdef(g,W,H){var sc=gscale(W);return[(W/2+(g.cx-100)*sc)/W,(H-4-(150-g.by)*sc)/H]}
function gpos(g,W,H,pos){var q=pos&&pos[g.id];return(q&&isFinite(q[0])&&isFinite(q[1]))?q:gdef(g,W,H)}
function hitRect(g){var t=g.tb.split(" ");return '<rect x="'+t[0]+'" y="'+t[1]+'" width="'+t[2]+'" height="'+t[3]+'" rx="4" fill="rgba(255,255,255,.14)" style="stroke:var(--btn)" stroke-width="1.2" stroke-dasharray="4 3"/>'}
function gardenPx(W,H,eq,pos,edit){
 var sc=gscale(W),s="",pl={};
 eq.forEach(function(id){var g=gItem(id),q=gpos(g,W,H,pos),x=q[0]*W,y=q[1]*H;pl[id]=[x,y];s+='<g class="dg" data-id="'+id+'" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+sc.toFixed(3)+')">'+g.art()+(edit?hitRect(g):"")+'</g>'});
 if(!edit){var cnt={},n=0;BFLY.forEach(function(b,j){if(!bfFound(j)||!pl[b.fav])return;var g=gItem(b.fav),c=cnt[g.id]||0;cnt[g.id]=c+1;var pp=pl[b.fav],x=pp[0]-10*sc+c*16*sc,y=pp[1]-(g.hv+8)*sc;s+='<g class="bfp" style="animation-delay:-'+(n*2.7).toFixed(1)+'s;animation-duration:'+(9+(n%3)*2)+'s"><svg x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(20*sc).toFixed(1)+'" height="'+(16*sc).toFixed(1)+'" viewBox="0 0 40 32">'+bfInner(j,true)+'</svg></g>';n++})}
 return s;
}
function renderGarden(){var el=document.getElementById("gard");if(!el)return;var z=winSize();el.setAttribute("viewBox","0 0 "+z.W+" "+z.H);el.innerHTML=gardenPx(z.W,z.H,S.garden.eq,S.garden.pos,false)}
function renderHouse(){var el=document.getElementById("house"),e=eqHouse();if(el)el.innerHTML=e?e.art():"";if(document.body)document.body.classList.toggle("hh",!!e);renderGarden()}
function previewSvg(){
 var z=winSize(),W=z.W,H=z.H,e=eqHouse(),gd=S.garden.eq.length;
 if(!e&&!gd)return '<div style="display:grid;place-items:center;padding:14px 0">'+forestThumb(150)+'<p style="margin:4px 0 8px;font-size:13.5px;color:var(--ink2)">Just forest for now.</p></div>';
 var s='<svg class="hs mw" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false"><rect width="'+W+'" height="'+H+'" rx="16" style="fill:var(--bg);stroke:var(--line)" stroke-width="3"/><ellipse cx="'+(W/2)+'" cy="'+(H+H*.02)+'" rx="'+(W*.75)+'" ry="'+(H*.1)+'" fill="#9cbc78"/>';
 if(e){var hw=Math.min(380,W*.96),hh=hw*162/304;s+='<svg x="'+((W-hw)/2)+'" y="'+(H-4-hh)+'" width="'+hw+'" height="'+hh+'" viewBox="-52 -12 304 162">'+e.art()+'</svg>'}
 return s+gardenPx(W,H,S.garden.eq,S.garden.pos,false)+'</svg>';
}
function gardenList(){
 var h="";
 if(S.garden.own.length)h+='<div class="card center" style="margin-bottom:10px"><p style="margin:0 0 8px;font-size:14px;color:var(--ink2)">Drag your plants anywhere on the screen, then save or discard.</p><button class="btn" data-a="garr">Arrange garden</button></div>';
 GARDEN.forEach(function(g,i){
  var own=S.garden.own.indexOf(g.id)>=0,eqd=S.garden.eq.indexOf(g.id)>=0,inv=[];
  BFLY.forEach(function(b,j){if(b.fav===g.id)inv.push(bfFound(j)?b.n:"a butterfly you haven’t met yet")});
  var btn;
  if(own)btn=eqd?'<span class="tag">Placed</span><button class="gbtn" data-a="gequip" data-i="'+i+'">Remove</button>':'<span class="tag">In storage</span><button class="btn" data-a="gequip" data-i="'+i+'">Place</button>';
  else btn=S.pts>=g.p?'<button class="btn" data-a="gbuy" data-i="'+i+'">Plant for '+g.p+'</button>':'<div class="need">'+acorn(14)+' '+g.p+' acorns · '+(g.p-S.pts)+' to go</div>';
  h+='<div class="gcard"><div class="ga"><svg viewBox="'+g.tb+'" width="64" height="64" aria-hidden="true">'+g.art()+'</svg></div><div><h3>'+esc(g.n)+'</h3><small>'+esc(g.blurb)+'</small>'+(inv.length?'<p style="font-size:13px;color:var(--ink2);margin:0 0 4px">Invites: '+esc(inv.join(", "))+'</p>':'')+btn+'</div></div>';
 });
 return h;
}
function editTray(){
 var h="";
 S.garden.own.forEach(function(id,k){var g=gItem(id),on=EDIT.eq.indexOf(id)>=0;h+='<button class="'+(on?"on":"off")+'" data-a="etoggle" data-i="'+k+'" aria-pressed="'+on+'"><svg viewBox="'+g.tb+'" width="28" height="28" aria-hidden="true">'+g.art()+'</svg>'+esc(g.n)+'</button>'});
 document.getElementById("etray").innerHTML=h||'<span style="font-size:13px;color:var(--ink2)">Buy plants in the garden shop first.</span>';
}
function editDraw(){
 if(!EDIT)return;var z=winSize(),sv=document.getElementById("esvg");
 sv.setAttribute("viewBox","0 0 "+z.W+" "+z.H);sv.innerHTML=gardenPx(z.W,z.H,EDIT.eq,EDIT.pos,true);editTray();
 document.getElementById("ehint").textContent=EDIT.arm?"Tap Discard again to drop your changes.":"Drag a plant to move it. Tap the tray to place or remove one.";
}
function editOpen(){EDIT={eq:S.garden.eq.slice(),pos:JSON.parse(JSON.stringify(S.garden.pos||{})),dirty:false,arm:false};document.getElementById("edit").classList.add("on");document.body.style.overflow="hidden";editDraw()}
function editClose(){EDIT=null;_drag=null;document.getElementById("edit").classList.remove("on");document.body.style.overflow=""}
(function(){
 var sv=document.getElementById("esvg");if(!sv||!sv.addEventListener)return;
 sv.addEventListener("pointerdown",function(e){
  if(!EDIT||!e.target||!e.target.closest)return;var gEl=e.target.closest(".dg");if(!gEl)return;
  var id=gEl.getAttribute("data-id"),g=gItem(id),z=winSize(),q=gpos(g,z.W,z.H,EDIT.pos);
  _drag={id:id,el:gEl,ox:e.clientX-q[0]*z.W,oy:e.clientY-q[1]*z.H,z:z};EDIT.arm=false;
  try{sv.setPointerCapture(e.pointerId)}catch(x){}
  e.preventDefault();if(gEl.parentNode)gEl.parentNode.appendChild(gEl);
 });
 sv.addEventListener("pointermove",function(e){
  if(!_drag||!EDIT)return;var z=_drag.z,x=Math.max(0,Math.min(z.W,e.clientX-_drag.ox)),y=Math.max(0,Math.min(z.H,e.clientY-_drag.oy));
  EDIT.pos[_drag.id]=[x/z.W,y/z.H];EDIT.dirty=true;
  _drag.el.setAttribute("transform","translate("+x.toFixed(1)+" "+y.toFixed(1)+") scale("+gscale(z.W).toFixed(3)+")");e.preventDefault();
 });
 var end=function(){_drag=null};sv.addEventListener("pointerup",end);sv.addEventListener("pointercancel",end);
})();
load();render();_lw=window.innerWidth;renderHouse();buildScene();buildLeaves();if(S.mopen)musicToggle(true);
</script>
</body>
