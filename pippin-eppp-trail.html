g future incidents.","Treatment and Prevention","Which response lowers repeat offenses?","Domestic violence interventions","According to the exam key, arrest and imprisonment produce the lowest recidivism among the options."],["Which of the following theories would see job enrichment as a valuable intervention?",["Reinforcement theory.","Expectancy theory.","Two-factor theory.","Equity theory."],2,"Job enrichment involves expanding jobs to give employees a greater role in planning and performing their work, thus providing an opportunity to build motivators or satisfiers into job content. It involves increasing employees' autonomy, authority, and freedom, and encouraging employees to take on challenging tasks.","Cognitive-Affective","Enrichment adds motivators.","Two-factor theory (Herzberg)","Motivators such as responsibility and achievement drive satisfaction. Hygiene factors such as pay only prevent dissatisfaction."],["On the way to class, you are attacked in the parking lot. You are most likely to get help if:",["one person witnesses the event.","three people witness the event.","ten people witness the event.","you are alone."],0,"In general, the fewer the number of bystanders, the more likely it is that a victim will get help. Other factors that influence the willingness of bystanders to help is whether they themselves have been victims of a violent crime and whether they have training in first aid or other helping skills. \"Bystander apathy\" refers to the failure of bystanders to give assistance.","Social and Multicultural","Diffusion of responsibility works against the victim.","Bystander effect","The more bystanders there are, the less likely any one will help. A single witness is most likely to help."],["An individual who is uncomfortable with his or her homosexual orientation should receive a diagnosis of:",["Ego-Dystonic Homosexuality.","Paraphilia.","Gender Identity Disorder.","Sexual Disorder, NOS."],3,"In both DSM-III-R and DSM-IV, the diagnosis for someone uncomfortable with his or her homosexual orientation is Sexual Disorder NOS. Way back in DSM-III, the diagnosis would have been Ego-Dystonic Homosexuality. A Paraphilia is a sexual disorder that is characterized by unusual sexual fantasies or practices (e.g., exhibitionism and fetishism).","Assessment and Diagnosis","This uses an older DSM-IV category.","Ego-dystonic homosexuality","Under DSM-IV, marked distress about one's orientation could be coded Sexual Disorder NOS. Orientation itself is not a disorder."],["The feature of speech that would normally be remembered best by a listener is:",["semantic.","syntactic.","phonemic.","acoustic."],0,"Semantic refers to meaning. What we usually remember most is the meaning of what someone has told us. Syntactic refers to grammatical order.","Cognitive-Affective","People remember gist over exact wording.","Semantic memory for speech","Listeners best remember the meaning of what was said, not the exact words or sounds."],["Research on sex biases has found that, when asked to rate the quality of an essay:",["male judges will rate male writers more favorably, while female judges will rate female writers more favorably.","male judges will rate female writers more favorably, while female judges will rate male writers more favorably.","both male and female judges will rate female writers more favorably.","both male and female judges will rate male writers more favorably."],3,"Research on sex bias has found that both male and female judges tend to rate male writers more favorably.","Social and Multicultural","Both men and women show the same bias.","Gender bias in evaluation","Both male and female judges tend to rate work attributed to male writers more favorably."],["A dog has learned to jump when he hears a clap because the experimenter had repeatedly clapped right before giving the dog an electric shock. The experimenter now says \"bad dog\" right before clapping. Eventually, the dog will jump whenever he hears the experimenter yell \"bad dog.\" This experiment is a paradigm of:",["higher-order conditioning.","stimulus generalization.","unethical treatment of animals in research.","pseudoconditioning."],0,"Higher-order conditioning involves pairing the conditioned stimulus (CS) with another neutral stimulus that is typically unrelated (e.g., pairing the clap with saying bad dog). At this level, it is also referred to as second-order conditioning. Stimulus generalization involves generalizing from the conditioned stimulus (CS) to other similar neutral stimuli (e.g., generalizing from a clap to other loud noises).","Cognitive-Affective","A cue becomes a stand-in for the original.","Higher-order conditioning","A neutral stimulus becomes conditioned by pairing with an already-conditioned stimulus, not the original UCS."],["A physician refers a patient to a psychologist who specializes in the treatment of pain. The patient has back pain secondary to a serious accident at work six months ago, in which he ruptured several disks. The psychologist should:",["use hypnotherapy.","conduct progressive muscle relaxation.","use psychodynamic treatment.","conduct an assessment for malingering."],0,"Of the choices given hypnotherapy is the only acceptable response. Hypnotherapy is one treatment approach that is used for treating chronic pain. Chronic pain is also commonly treated with cognitive-behavioral interventions (e.g., activity-rest scheduling).","Treatment and Prevention","Look for a treatment used for chronic pain.","Hypnosis for pain","Hypnotherapy is a well-supported option for chronic pain control."],["A child looks up in the sky, sees a bird, and then says \"plane.\" This behavior represents:",["assimilation.","accommodation.","equilibration.","object permanence."],0,"Piaget coined the term adaptation, which is the process by which a person adjusts to the environment using two complementary processes, assimilation and accommodation. Assimilation involves incorporating a new experience into an already established mental structure, while accommodation involves modifying or expanding a cognitive structure or schema to take in new information.","Growth and Lifespan","Fitting a new thing into an old category.","Assimilation (Piaget)","Fitting new experiences into an existing schema, like calling a plane \"bird.\""],["In regard to testimonials, the APA Ethics Code stipulates that:",["testimonials may neither be solicited nor used.","testimonials may be used, but not solicited.","testimonials may be used and solicited as long as they are not solicited from current patients or those vulnerable to undue influence.","testimonials may not be solicited, however they may be used as long as they are not from current patients or those vulnerable to undue influence."],2,"The APA Ethics Code states that it is permissible to solicit and use testimonials as long as they are not solicited from current patients or those vulnerable to undue influence (e.g., a former patient with dependent personality disorder).","Ethics, Legal, Professional","Read this one closely for who may be solicited.","Testimonials","Psychologists may not solicit testimonials from current clients or others vulnerable to undue influence."],["The person who holds privilege in court-ordered treatment is:",["the client.","the psychologist.","the court.","the judge."],0,"This question is a bit tricky; it requires that you know the difference between evaluations or assessments for the court, as opposed to court-ordered therapy. When a therapist performs evaluations on behest of the court, the client has no privilege and must be informed of the lack of confidentiality at the outset.","Ethics, Legal, Professional","Whose secrets are they?","Privilege","The client holds privilege, even in court-ordered treatment."],["A behavior is reinforced on average every third time it occurs. The schedule of reinforcement being used is:",["fixed interval.","variable interval.","fixed ratio.","variable ratio."],3,"This is a difficult question that requires careful reading. In a variable ratio schedule, behavior is reinforced after an unpredictable number of responses. Slot machines are an example of a variable ratio schedule.","Cognitive-Affective","The reward count varies around an average.","Variable ratio schedule","Reinforcement after an unpredictable number of responses, producing high, steady responding."],["According to the tenets of Alcoholics Anonymous, addiction:",["is an overlearned habit.","is a disease.","is merely societal mislabeling.","results from inadequate self worth."],1,"Alcoholics Anonymous adheres to a disease model of addiction. By contrast, Marlatt's approach to managing addiction, which is cognitive behavioral (skills for relapse prevention are taught), views addiction primarily as an overlearned habit.","Treatment and Prevention","Think of the AA view of addiction.","Disease model of addiction","AA holds that alcoholism is a lifelong disease that abstinence manages."],["In conducting an ABAB design, the researcher would be concerned with:",["history and maturation.","regression and diffusion.","failure of IV to return to baseline.","failure of DV to return to baseline."],3,"An ABAB design is a type of single subject design in which the person is first measured over time during a baseline phase (A), then treatment is implemented and the person is once again measured repeatedly during the intervention phase (B). Treatment is then removed, and the person is measured at baseline again (A). Finally, treatment is implemented again and the person is repeatedly measured (B).","Research and Statistics","What must the behavior do when treatment is withdrawn?","ABAB reversal design","A design that requires the behavior to return to baseline when treatment is withdrawn."],["The Neo-Freudians emphasize:",["underlying unconscious conflicts.","ego defensive and conflict-free functioning.","social interactions.","beliefs."],2,"The focus of the Neo-Freudians is on how social and cultural factors influence and shape personality. Classical analysts focus intensely on underlying unconscious conflicts. The ego analysts focus on ego defensive and conflict-free functioning, and the cognitive behaviorists focus on beliefs.","Treatment and Prevention","Think of Horney, Sullivan, and Fromm.","Neo-Freudians","Theorists who stressed social and cultural influences and interpersonal relationships over drives."],["Withdrawal from which substance is most likely to cause hallucinations?",["LSD.","Amphetamines.","Heroin.","Phenobarbital."],3,"The substances whose withdrawal syndromes involve hallucinations are alcohol, and the category of sedatives, hypnotics, and anxiolytics. Withdrawal from these substances can potentially be fatal. Phenobarbital is a barbiturate, which is a type of hypnotic.","Biological Bases","Withdrawal from a sedative can be dangerous.","Barbiturate withdrawal","Withdrawal from sedatives like phenobarbital can cause seizures and hallucinations."],["A doctoral student gets business cards and includes on his cards that he is a Ph.D. candidate and that he accepts patients on a sliding scale. According to the APA Ethics Code:",["he can advertise his fee schedule, but listing his candidate status is unethical.","he can list both his fee schedule and his candidate status.","it is unethical to list either his fee schedule or his candidate status.","he can mention his candidate status, but it is unethical to advertise his fee schedule."],0,"According to the APA Ethics Code, Section 5.01, which covers advertising and public statements, psychologists should avoid making false or deceptive public statements. In this case, advertising one’s doctoral status would be considered confusing to the lay public, as they would see the degree and may not know that “candidate” designates a student. Listing the fee schedule is considered ethical.","Ethics, Legal, Professional","Two claims, one of them misleading.","Advertising with degrees","Fees may be advertised, but a person not yet holding the degree may not imply that credential."],["A lecturer who is a psychologist is asked by a member of the audience for a referral for an alcohol treatment center. The lecturer offers the referral. The person later files ethics charges against the psychologist because the alcohol program was mediocre. The psychologist:",["is guilty of an ethics violation.","may be guilty of an ethics violation.","is not guilty of an ethics violation.","is not guilty of an ethics violation only if he made clear initially that the referral was solely informational."],2,"A lecturer who only gives information to an audience member about a program is not responsible for the actual program or its outcome.","Ethics, Legal, Professional","Answering a direct request is not solicitation.","Referrals","Providing a requested referral to a treatment center is not, by itself, an ethics violation."],["A child with a reading disorder is most likely to:",["continue to have that disability as an adult.","have low vocabulary scores.","have impaired vision or hearing.","have few friends."],0,"The most likely outcome for a child with a reading disorder is to have continued problems in this area as an adult, although for some individuals the problem seems to resolve by adulthood.","Growth and Lifespan","Reading problems tend to persist.","Reading disorder","Reading disabilities typically continue into adulthood."],["A researcher is interested in the relationship between morality and criminal behavior among Christians. The researcher measures morality based on rate of church attendance, and finds that many of the non churchgoers have no criminal record. The best explanation for this finding is:",["criterion contamination.","criterion deficiency.","criterion relevance.","criterion-related validity."],1,"In research, the conceptual criterion is the theoretical construct that the researcher is attempting to measure, in this case, morality. In this research, morality is measured based on rate of church attendance, however, this criterion is deficient or lacking. In other words, as the researcher found, there are many moral people who do not attend church.","Assessment and Diagnosis","A measure that misses part of the concept.","Criterion deficiency","When a criterion fails to measure all the important aspects of the construct."],["The time required to complete a mechanical test was recorded. About 25% of the people took the maximum allowed amount of time. What would be the best measure of central tendency?",["The mean.","The median.","The mode.","The mean, median, and mode would be equally good measures."],1,"In general, the mean is the best measure of central tendency, however, the median is better when there are either some very extreme scores, or a substantial percentage of maximum scores. In this example, a relatively large percentage of people (25%) received the highest possible score, and so the median should be used.","Research and Statistics","Cut-off scores create skewed data.","Median","The middle score, preferred when data are skewed or have extreme or capped values."],["A person earns \"idiosyncrasy credits\" by:",["being \"likeably eccentric.\"","initially conforming to group norms.","reciprocally tolerating idiosyncrasy in colleagues.","voicing his or her opinion in a consistent, logical manner."],1,"Idiosyncrasy credits refer to a group's tolerance of an individual's disregard for group norms. They can be earned by initially conforming to the group norms.","Social and Multicultural","Conform first, deviate later.","Idiosyncrasy credits","Credit earned by conforming that lets a member later deviate without penalty."],["The therapist ingredient that contributes the most to successful therapy outcome is:",["experience.","personal therapy.","empathy.","gender."],2,"Of all the therapist ingredients that contribute to success, empathy has been found to be among the most powerful. Experience does not seem to have too much bearing on outcome, and when you think about it, doing therapy for 10 or 20 years doesn't necessarily make one \"good at it.\"","Treatment and Prevention","What does Rogers say?","Common factors","Therapist empathy is among the strongest contributors to therapy outcome."],["According to Yalom, in which stage of group therapy do members become hostile?",["First stage.","Second stage.","Third stage.","In any stage if the leader fails to provide a holding environment."],1,"According to Yalom, the first stage is characterized by hesitant participation, a search for meaning, and dependency. The second stage includes conflicts, efforts at dominance, and rebellion against the leader. The third stage is marked by the development of cohesiveness.","Social and Multicultural","Yalom's stages: orientation, conflict, cohesion.","Yalom's group stages","Stage 2 is conflict, with hostility and struggles over power."],["A mother continuously nags her son to take out the trash until he finally does. This is an example of:",["positive reinforcement.","positive punishment.","negative reinforcement.","negative punishment."],2,"Because the mother nags the child in an attempt to increase the child's behavior (or taking out the garbage), we are looking at a paradigm of reinforcement. Once the child takes out the garbage, it is assumed the mother stops nagging. Because the mother removes an aversive stimulus (nagging), we are looking at negative reinforcement.","Cognitive-Affective","The nagging ends when he acts.","Negative reinforcement","Removing an aversive event (nagging) after a behavior to increase that behavior."],["An adult who is administered the Adult Attachment Interview is able to recall many attachment experiences but has difficulty describing them in a coherent and linear manner. When this adult’s infant is assessed in the Strange Situation, the infant will probably demonstrate an attachment pattern that is:",["secure.","ambivalent.","avoidant.","disorganized/disoriented."],1,"In the Adult Attachment Interview, adults are asked to discuss their early attachment experiences. Their responses are not analyzed by the content of the memories but rather by the manner in which these memories are discussed. The adult in this example would be considered “preoccupied.” Such adults are overly concerned with the attachment memories but “get lost” while they are talking, often losing their line of thought.","Growth and Lifespan","Many memories, tangled telling.","Preoccupied (ambivalent) attachment","In the Adult Attachment Interview, an adult who recalls many experiences but tells them incoherently is preoccupied, comparable to ambivalent attachment."],["A patient you have been seeing for three months is switching insurance companies. She asks you if you'd be willing to diagnose her as if this were a new condition. If you comply with this request, you are acting:",["illegally.","ethically but illegally.","unethically and illegally.","ethically and legally."],2,"Providing inaccurate information to the insurance company would constitute insurance fraud. It is both illegal and unethical.","Ethics, Legal, Professional","Diagnosing what is not true.","Insurance fraud","Misrepresenting a diagnosis to an insurer is both unethical and illegal."],["The medication of choice for Bipolar I Disorder is:",["Buspar.","Prozac.","Lithium carbonate.","Haloperidol."],2,"Among those listed, the medication of choice for Bipolar I Disorder is Lithium. Other medications commonly used for Bipolar I Disorder include the anti-convulsants Tegretol and valproic acid. Buspar is used for Anxiety Disorders, Prozac for depression, and haloperidol for Schizophrenia and Tic Disorders.","Biological Bases","A mood-stabilizing salt.","Lithium carbonate","The first-line medication for bipolar I disorder."],["Alternative work schedules (e.g. flextime, 4-day workweek):",["positively affect performance and morale about equally.","positively affect performance more than morale.","positively affect morale more than performance.","have relatively little impact on morale and performance."],2,"Alternative work schedules have been found to have little impact on performance, but to have a significant impact on improving morale.","Treatment and Prevention","Happier, not necessarily more productive.","Flextime","Alternative schedules tend to raise morale and satisfaction more than they improve performance."],["A 72-year-old woman takes the WAIS-IV. She scores highest on block design and matrix reasoning and lowest on vocabulary and information. Which of the following statements regarding her performance would be most accurate?",["She shows the classic aging profile with crystallized intelligence declining more than fluid intelligence.","She shows the classic aging profile with fluid intelligence declining more than crystallized intelligence.","She does not show the classic aging profile because subtests measuring crystallized intelligence do not show more impairment than subtests measuring fluid intelligence.","She does not show the classic aging profile because subtests measuring fluid intelligence do not show more impairment than subtests measuring crystallized intelligence."],3,"This is a very tricky question because, in addition to requiring you to have a clear understanding about the \"classic aging profile,\" it uses convoluted wording and double negatives. The classic aging profile involves maintained or enhanced crystallized intelligence with diminished fluid intelligence.","Growth and Lifespan","Which skills fade with age, and which hold?","Fluid versus crystallized intelligence","Fluid abilities (like block design) decline with age while crystallized ones (vocabulary) hold up. This woman shows the reverse."],["You are offered a choice between two scrumptious desserts, pecan pie and chocolate cake, and you feel quite torn. When pressed to decide, you select the chocolate cake. You then tell your friend that you really aren't that fond of pecan pie. Your behavior can be explained by:",["an approach-approach conflict.","an approach-avoidance conflict.","the self-serving bias.","the reciprocity hypothesis."],0,"The approach-approach conflict is one in which the person must choose between two desirable alternatives, and, subsequent to choosing, slightly devalues the alternative not chosen. This is a bit like what one would expect as a result of cognitive dissonance. In an approach-avoidance conflict, the individual is both drawn to and repelled by the same alternative.","Social and Multicultural","Two good choices, torn between them.","Approach-approach conflict","A choice between two desirable options."],["Hypervigilance is a symptom of which of the following childhood disorders?",["Reactive Attachment Disorder, Disinhibited Type.","Reactive Attachment Disorder, Inhibited Type.","Separation Anxiety Disorder.","Childhood Disintegrative Disorder."],1,"According to DSM-IV, Reactive Attachment Disorder of Infancy or Early Childhood occurs in reaction to \"grossly pathological care\" and results in \"markedly disturbed . . . social relatedness.\" In the disinhibited type of the disorder, there is \"indiscriminant sociability,\" e.g., the child responds to strangers in an over-friendly way. In the inhibited type, the child is inhibited, hypervigilant, or highly ambivalent.","Assessment and Diagnosis","Being constantly on guard in a child.","Reactive attachment disorder","A childhood disorder from early neglect marked by disturbed social relating, with the inhibited type showing hypervigilance."],["In comparing minorities and non-minorities in terms of therapy:",["no differences have been found between minorities and non-minorities.","no differences have been found in terms of outcome, however, minorities are more likely to prematurely terminate.","it's best to match the patient with a therapist of the same ethnicity.","minorities prefer a more directive stance than non-minorities."],1,"Research has found that minorities prematurely terminate more often than non-minorities; however, if minorities stay in treatment, they seem to do as well as non-minorities. There is no clear research support for matching the ethnicity of therapists with that of their patients. Different minority groups demonstrate different preferences for degree of directiveness.","Treatment and Prevention","Look at outcomes and dropout.","Minority clients in therapy","Outcomes are similar, but minority clients tend to drop out more."],["The key difference between Autistic Disorder and Asperger's Disorder is:",["Asperger's Disorder does not include significant delays in language.","Autistic Disorder requires onset before two years of age.","Asperger's Disorder requires normal development for the first two years.","Asperger's Disorder includes social and language impairments, but not stereotyped behaviors and activities."],0,"Autistic Disorder and Asperger's Disorder are very similar Pervasive Developmental Disorders. Both of their diagnostic criteria include social interaction impairments and stereotyped or repetitive behavior and activities. However, the criteria for Asperger's Disorder specifically exclude delays in language whereas Autistic Disorder requires language impairment.","Assessment and Diagnosis","Language is the difference.","Asperger's versus autistic disorder","Asperger's has no significant delay in language or cognitive development."],["In order to increase studying behavior, you set up a deal with yourself in which you allow yourself to engage in one hour of your favorite activity following a good study session. Underlying your thinking is an understanding of:",["generalized conditioned reinforcers.","the Premack Principle.","chaining.","response generalization."],1,"The Premack Principle involves using a high frequency behavior (in this case, a favorite activity) to reinforce a low frequency behavior (in this case, studying). Generalized conditioned reinforcers are a special case of secondary reinforcers that acquire their reinforcing value because they can be exchanged for other reinforcers. Generalized conditioned reinforcers include money and tokens.","Cognitive-Affective","A favorite activity as a reward.","Premack principle","A high-frequency behavior can reinforce a low-frequency one."],["After you have tested a 19-year-old college student, his parents request the testing results. Your best course of action would be to:",["release the information to the parents since they are the legal guardians.","get a release signed by the son before releasing the information.","withhold the information, because of potential misuse by nonprofessionals.","proceed with caution."],1,"At 19, the student is an adult, so his written consent is needed before his test results can be released to his parents.","Ethics, Legal, Professional","He is an adult.","Release of information","A competent adult's written release is required before results go to anyone, including parents."],["A person believes that Friday the 13th is an unlucky day because she got very sick once on Friday the 13th. The best explanation for this phenomenon is:",["irrational beliefs.","respondent conditioning.","instrumental conditioning.","a psychotic process."],1,"Although this is rather irrational thinking, what would best explain this phenomenon would be pairing Friday the 13th (an initially neutral stimulus) with an aversive unconditioned stimulus (getting sick). This is a classical conditioning phenomenon, also called respondent conditioning. Instrumental conditioning is another name for operant conditioning.","Cognitive-Affective","Sick once, now Friday the 13th means danger.","Respondent (classical) conditioning","A neutral stimulus paired with an aversive one comes to produce fear."],["The average effect size found in psychotherapy outcome research is about:",["1.5.",".9.",".6.",".35."],1,"The average effect size found in recent psychotherapy outcome research is about .85. Keep in mind that an effect size is a measure of standard deviation, so .85 means that treated people do about .85 of a standard deviation better than untreated individuals.","Treatment and Prevention","Effect sizes near 1 are large.","Effect size in outcome research","The average effect of psychotherapy is large, about .8 to .9, per the exam key."],["While lecturing, a speaker experienced panic attacks on three separate occasions within a one-month period. The speaker's most likely diagnosis is:",["Panic Disorder With Agoraphobia.","Panic Disorder Without Agoraphobia.","Social Phobia.","Specific Phobia."],2,"This question describes an individual who experienced panic attacks while public speaking. This symptom is consistent with a diagnosis of Social Phobia. In some cases of Social Phobia, the individual concurrently experiences panic attacks.","Assessment and Diagnosis","Fear in one situation, performing in front of others.","Social phobia","Marked fear of social or performance situations. Panic attacks can occur, but only in those situations."],["A psychology intern worries that she behaved inappropriately at a clinic staff meeting. She closely observes the behavior of the post-doctoral fellows and decides she has acted appropriately. Her behavior could best be explained by:",["the self-serving bias.","observational learning.","social comparison theory.","the fundamental attribution error."],2,"Social comparison theory suggests that when standards are ambiguous and subjective (e.g., \"professionalism\"), we compare ourselves to others (usually but not always those slightly above us), which is what the intern did in this example. Self-serving bias refers to people's tendency to make dispositional attributions for their success and situational attributions for their failure.","Social and Multicultural","She compares herself with others like herself.","Social comparison theory","People evaluate themselves by comparing with others when no objective standard exists."],["Which of the following statements best summarizes the attitude of the APA's Ethical Principles of Psychologists and Code of Conduct (2002) toward multiple relationships?",["It is unethical to enter into a multiple relationship that can be avoided.","Multiple relationships that cannot be avoided may be ethically permissible if they do not impair the psychologist's functioning or risk harm or exploitation.","Multiple relationships that do not impair the psychologist's functioning or risk harm or exploitation are not unethical.","Multiple relationships are not inherently unethical unless they violate other ethical standards against risking harm or exploitation to clients."],2,"The 2002 Ethics Code states that \"multiple relationships that would not reasonably be expected to cause impairment or risk exploitation or harm are not unethical.\" There is no stipulation that multiple relationships should generally be avoided. The ethical standard on multiple relationships specifies the conditions for acceptable multiple relationships and does not refer to other standards.","Ethics, Legal, Professional","Think about impairment, not absolute bans.","Multiple relationships","Not all multiple relationships are prohibited, only those that could impair objectivity or risk harm."],["The frequency of sex in later life is most highly correlated with:",["availability of partners.","previous sex history.","age.","physical health."],0,"It is estimated that 70% of men and 20% of women over age 60 are sexually active. Sexually activity is usually limited by the absence of an available partner. Studies have demonstrated that sex drive does not decrease as men and women age, and, in fact, may sometimes increase.","Growth and Lifespan","What limits later-life sex most?","Sexuality in later life","The main limit is availability of a partner."],["A boy begins to display some fear of his father. Assuming there is no external basis for this fear (e.g., abuse), the boy is most likely in which of the following psychosexual stages?",["Anal.","Genital.","Phallic.","Latency."],2,"According to Freud, it is during the phallic stage (from three to about six years old) that children become sexually attracted to the parent of the opposite sex and consequently fear punishment from the parent of the same sex (e.g., castration anxiety in boys). The anal stage occurs from one to three years and involves conflicts around toilet training and retention versus expulsion.","Growth and Lifespan","Freud's stage of father rivalry.","Phallic stage","Ages 3 to 6, where the Oedipal conflict brings fear of the father (castration anxiety)."],["Electric shock therapy is most commonly used in treating:",["Major Depressive Disorder, Severe, With Psychotic Features.","Obsessive-Compulsive Disorder.","Schizophrenia.","Paraphilias."],0,"ECT (Electro-convulsive therapy) is most commonly used to treat depression that seems unresponsive to other interventions (e.g., drug-resistant, therapy-resistant). Despite its history, it is no longer considered an appropriate treatment for Schizophrenia.","Treatment and Prevention","The treatment for severe depression.","Electroconvulsive therapy (ECT)","Used mainly for severe depression that hasn't responded to other treatments, including psychotic features."],["The term professional psychologist is used to describe someone who:",["does psychotherapy.","has a doctorate in psychology from a regionally accredited school.","has a doctorate in psychology and is licensed in that state.","is license-eligible."],1,"The term professional psychologist describes a person with a doctorate in psychology from a regionally accredited school. One does not need to be licensed in order to be designated as a professional psychologist. For example, a person may call herself a Social Psychologist or Developmental Psychologist without having a license.","Ethics, Legal, Professional","\"Professional\" is defined by the degree and school.","Professional psychologist","A doctorate in psychology from a regionally accredited school."],["Under what circumstances may a subpoena for treatment records be ignored?",["The patient asks the therapist to assert privilege.","The therapist plans to assert privilege and will only reveal the records if a court order is issued.","The subpoena is issued in the course of a malpractice lawsuit.","A subpoena cannot be ignored."],3,"A subpoena is a legal document and may never simply be ignored, including when there is a malpractice lawsuit. The psychotherapist must show up at the appointed time with the required documents. Although the therapist may assert privilege, this does not mean that the subpoena is ignored.","Ethics, Legal, Professional","A subpoena is a legal demand, not a privilege waiver.","Subpoena for records","A subpoena can't simply be ignored. Respond by asserting privilege or seeking guidance until the court decides."],["Researchers have found that individuals with Type A personality have a higher incidence of cardiovascular disease than persons with Type B personality. Of the characteristics of the Type A personality, the one that is most predictive of heart disease is:",["hostility.","impatience.","perfectionism.","competitiveness."],3,"In the 1950's, Friedman and Rosenham's large scale Framingham studies found that individuals with Type A personalities (stressed, hard-driving, impatient, competitive) were more likely to suffer from heart disease than their more laid back Type B personality counterparts.","Assessment and Diagnosis","Which Type A trait is the toxic one?","Type A personality","Of the Type A traits, hostility and competitiveness are most linked to heart disease, per the exam key."],["In which of the following circumstances would it be problematic to use a chi square?",["When looking for differences between groups.","When the data are ordinal.","When repeated observations are made.","When there is more than one independent variable."],2,"Chi square is a non-parametric test of differences, used when data are nominal, or categorical. Although there are specific non-parametric tests for ordinal data (e.g., Mann-Whitney), the chi square can accommodate ordinal data. When there is more than one independent variable, the multiple sample chi square is run.","Research and Statistics","Chi square needs independent observations.","Chi-square test","A nonparametric test for frequencies in categories. Each observation must be independent, so repeated measures are a problem."],["In conducting group therapy, the therapist:",["is responsible for ensuring confidentiality among group members.","plays no role in ensuring confidentiality, as clearly this is not possible to enforce.","emphasizes the importance of confidentiality initially and periodically during the course of treatment, but keeps in mind that patients are actually on an honor system.","holds privilege for group members."],2,"Confidentiality is a sticky issue in groups, in that there is no way to actually enforce it or guarantee it to any member. The therapist is responsible for emphasizing the importance of confidentiality at the outset, and periodically reminding patients about it.","Ethics, Legal, Professional","Say it early, and say it more than once.","Confidentiality in group therapy","Stress the importance of confidentiality at the start and periodically, while noting the therapist can't guarantee it."],["Who would likely be a proponent of tipping the waiter after each course?",["Skinner.","Watson.","Ellis.","Bandura."],0,"Tipping the waiter after each course would be a form of continuous reinforcement. Of all the individuals listed here, Skinner is the proponent of reinforcement. Remember that Watson is a behaviorist involved with classical conditioning; Ellis is a Rational-Emotive Therapist (cognitive behavioral); and Bandura, a social cognitive behaviorist, is most well known for observational learning from a model.","Cognitive-Affective","Reinforce right after each behavior.","Skinner and immediate reinforcement","Reinforcement delivered right after each response strengthens it most effectively."],["The correlation between IQ scores and academic performance is:",["greater in elementary and high school, and smaller in college and graduate school.","smaller in elementary and high school and greater in college and graduate school.","relatively stable across different levels of schooling.","close to 0.0."],0,"If you did not know the answer to this question, you could have guessed it right by applying the concept of restriction of range (which crops up frequently in one form or another on the exam). Correlation (along with reliability and validity) is always lower when the range is restricted for one or both variables.","Growth and Lifespan","Range restriction lowers correlations.","Restriction of range","Correlations shrink in groups with a narrow range of scores, such as college and graduate students."],["The shape of a z-score distribution:",["is normal.","is skewed.","is flat (rectangular).","cannot be determined, since insufficient information has been given."],3,"To answer this question, you need to keep in mind that the shape of a Z-score distribution is identical to (or follows) the shape of the raw score distribution. Flat or rectangular would be correct if the question asked about the shape of the distribution of percentile ranks.","Research and Statistics","What does the z-score shape depend on?","Z-score distribution","A z-score transformation keeps the same shape as the raw scores, so the shape can't be known without more information."],["A man is undergoing a test of his blood cortisol levels. One reason for this may be:",["he is baseball player being tested for recent steroid use.","his stress level is being monitored.","his kidney functioning is being monitored.","he is undergoing a test for illicit drug use."],1,"Cortisol testing measures the level of corticosteroids in the blood, saliva or urine. Blood cortisol tests are used to monitor stress level, as well as to test adrenal function in suspected cases of Cushing’s or Addison’s diseases. Cortisol would not be monitored in a test for anabolic steroids (as distinguished from corticosteroids).","Biological Bases","Cortisol is the stress hormone.","Cortisol","A hormone released by the adrenal cortex during stress."],["The term \"vicarious learning\" is most closely associated with whom?",["Skinner.","Watson.","Ellis.","Bandura."],3,"Vicarious learning means that we can learn by watching and imitating others, and by anticipating future reinforcement. This notion is associated with Bandura's model of observational learning. Bandura's theory is usually called Social Learning Theory or Social Cognitive Behaviorism.","Cognitive-Affective","Learning by watching others.","Vicarious learning (Bandura)","Learning by observing others' behavior and its consequences."],["Research has found that when it comes to the disruptive effects of noise in the workplace:",["it is not the noise itself, but whether people think they can turn off the source of the noise.","intermittent noise is less disruptive than continuous noise.","noise is especially disruptive with simple, repetitive tasks.","noise has been found to have little impact in the workplace."],0,"The research on noise in the workplace has found that it is not the noise itself, but rather the perception of control that is important. People who perceive that they have control are not bothered by noise. It has also been found that continuous noise in the workplace is less disruptive than intermittent noise, and that noise is generally less disruptive with simple, repetitive tasks.","Social and Multicultural","Control changes how noise feels.","Perceived control","Noise is less harmful when people believe they can control or stop it."],["Cerebral Palsy most commonly results from:",["trauma at birth.","genetic abnormalities.","deficient fetal nutrition.","maternal alcohol use."],0,"Cerebral Palsy is a disorder that results from birth trauma in an otherwise healthy fetus. Genetic abnormalities result in Down's Syndrome. Maternal alcohol use can result in fetal alcohol syndrome (FAS).","Biological Bases","A brain injury around birth.","Cerebral palsy","A movement disorder from brain damage before, during, or shortly after birth, commonly linked to birth trauma or oxygen loss."],["Diseases that are X-linked are:",["more common in men than women.","more common in women than men.","about equally prevalent in men and women.","more common in adults than children."],0,"Diseases that are X-linked (such as color blindness) are much, much more common in males than females. If a mother is a carrier and the father is not color blind, each son has a 50% chance of being color blind. The daughters in this scenario can only be carriers and will not be color blind.","Assessment and Diagnosis","The gene is on the X chromosome.","X-linked disorders","Because males have one X chromosome, X-linked recessive conditions show up more often in men."],["A Jungian would consider that part of the personal and collective unconscious that is projected out to be:",["a defense.","transference.","a symptom.","discomfort with the shadow aspect of personality."],1,"Jungians view transference as a projection of the personal and collective unconscious. For example, one may initially experience one's therapist as a \"godlike\" figure (or archetype). Projection is not seen as a defense, a symptom, or reflecting discomfort with one's shadow.","Treatment and Prevention","The therapist gets the projection.","Transference (Jung)","Projecting unconscious material, personal or collective, onto the therapist."],["A therapist advertises that the first therapy session is free. Such practice is:",["ethically dubious.","unethical.","ethical, provided there is no coercion or undue influence.","illegal and unethical."],2,"Psychologists are allowed to advertise and offer the first session (consultation) for free, provided that there is then no coercion or undue influence to get the client to continue.","Ethics, Legal, Professional","Free is fine when no one is pressured.","Free first sessions","A free first session is ethical as long as there is no coercion or undue influence."],["Which of the following has significantly affected the use of selection tests in industry?",["Larry P. versus Riles (1979).","Debra versus Turlington (1981).","Griggs versus Duke Power (1971).","Hobson versus Hansen (1967)."],2,"The use of selection tests in industry has been influenced by the case of Griggs versus the Duke Power Company, in which it was ruled that certain tests, such as the Wonderlic, were unfair to use in making decisions about hiring and promotion. Broad, general testing was faulted, and testing was required to measure the specific skills required by a particular job. In Larry P. vs.","Assessment and Diagnosis","A famous 1971 case about job tests.","Griggs v. Duke Power","The Supreme Court held that employment tests must be job-related if they cause adverse impact."],["Individuals with Antisocial Personality Disorder are most influenced by:",["physical punishment.","embarrassment.","money.","medications."],2,"It has been found that money is one of the things that most influences a person with an Antisocial Personality Disorder. Physical punishment and embarrassment have little impact.","Treatment and Prevention","Think about what motivates them.","Antisocial personality disorder","People with this disorder respond more to tangible rewards like money than to punishment or social approval."],["Young children often lack the cognitive capacity to conserve. To cope with this inability, they often focus on the most salient aspect of a stimulus. This strategy is termed:",["equilibration.","centration.","seriation.","primary circular reaction."],1,"The pre-operational child centers on only one aspect of an object or situation at a time. For example, the child can’t understand that a mommy can also be a sister. Centration is also one component involved in the inability to conserve: the pre-operational child fails to understand that a tall, thin glass may actually hold the same amount of liquid as a short but stout glass.","Growth and Lifespan","Focusing on one feature.","Centration","In the preoperational stage, focusing on one salient aspect of a situation and ignoring others."],["Which of the following is most correlated with \"successful aging?\"",["Higher socioeconomic status.","More familial support.","Higher level of activity.","Religious faith."],2,"Successful aging is most associated with a high activity level.","Growth and Lifespan","Keeping busy helps.","Successful aging","Staying active and engaged is most linked to successful aging (activity theory)."],["You are most likely to remember the answer to these questions if immediately after you take them and review the rationales you:",["go over them again.","relax.","sleep.","make flash cards."],2,"The interference theory of memory proposes that we remember best when we minimize interference immediately after we learn something, or in this case, if we sleep.","Cognitive-Affective","Sleep locks memory in.","Memory consolidation","Memory is consolidated during sleep, which helps you retain what you studied."],["A Structural Family Therapist would be most likely to:",["work on boundary issues.","work on differentiation issues.","prescribe the symptom.","be concerned with double binds."],0,"Structural Family Therapists follow the work of Minuchin. The key aspect of this treatment is focusing on the family's hierarchy and working on problematic boundary issues. Differentiation issues are addressed by Bowenian family systems therapists.","Treatment and Prevention","Family boundaries are Minuchin's language.","Structural family therapy","Minuchin's therapy focuses on family structure, boundaries, hierarchy, and coalitions."],["In order to adhere to the highest possible standards, when sending patient information electronically to an insurance company for billing, you should:",["clearly mark it confidential.","follow it up with a hard copy in the mail.","code the client's name.","refuse to do so."],0,"This question refers to sending confidential patient information by modem, for example. In this situation, it is sufficient to identify the information as confidential.","Ethics, Legal, Professional","Mark it private.","Electronic transmission of records","Take reasonable steps to protect confidentiality, like marking it confidential and sending only what's needed."],["After being released from the hospital, a child is returned to her regular classroom, and a supportive counseling program is set up. This is an example of:",["primary prevention.","secondary prevention.","tertiary prevention.","community-based intervention."],2,"A supportive program set up after an individual is released from the hospital would be tertiary prevention, which aims to prevent relapse and keep a person functioning at the highest level possible. Other examples of tertiary prevention would include day treatment programs for people with Schizophrenia, or AA for alcoholics.","Treatment and Prevention","Reducing lasting disability after illness.","Tertiary prevention","Working to reduce the impact of an established problem, such as rehabilitation and support after hospitalization."],["The neurotransmitter most associated with voluntary movement is:",["acetylcholine.","serotonin.","norepinephrine.","GABA."],0,"Acetylcholine is involved in voluntary movement. Serotonin is involved with mood disorders, sleep onset, sex, and aggression. Norepinephrine is also involved with mood disorders, and GABA is associated with anxiety, epilepsy, and schizophrenia.","Biological Bases","Muscles get the signal from this chemical.","Acetylcholine","A neurotransmitter for voluntary movement and memory."],["A manager that adhered to Theory Y would tend to:",["allow her employees to take part in decision-making.","set firm rules about tardiness, absenteeism, and loafing.","believe that workers are primarily motivated by pay.","follow the premises of scientific management."],0,"While Theory X assumes that workers are lazy and must be coerced, Theory Y contends that people are industrious, creative, and seek responsibility. An adherent of Theory Y would likely allow employees to take part in decision-making. The other responses would typify an adherent of Theory X.","Treatment and Prevention","Theory Y says people are self-motivated.","Theory Y","McGregor's view that employees are motivated and creative, so managers involve them in decisions."],["You are on an admissions committee and your husband applies to that program. You should:",["proceed with caution.","withdraw temporarily from the committee.","withdraw permanently from the committee.","seek consultation."],1,"If you are on an admissions committee and your husband (or for that matter anyone you know) applies to the program, you should temporarily withdraw from the committee.","Ethics, Legal, Professional","Step aside from the decision.","Conflict of interest","Recuse yourself when a personal relationship could bias your judgment."],["The disadvantage of being in group therapy concurrent with individual therapy is that:",["the patient is less likely to reveal in the group.","the patient is more likely to receive favoritism by the therapist, and thereby alienate group members.","the patient is more likely to be overwhelmed and possibly decompensate.","the patient is more likely to experience multiple transferences in the group situation."],0,"One disadvantage of being in both individual and group therapy is the tendency to reveal less in the group and save self-disclosure for what is seen as a less risky situation, namely individual therapy.","Treatment and Prevention","Patients hold back in one place.","Concurrent group and individual therapy","The patient may be less willing to share in the group because of what has been said elsewhere."],["Group polarization occurs when:",["a non-cohesive group splits into factions.","majority members ally against minority members.","group members make more extreme decisions than they would have individually.","a new member enters who unbalances the homeostasis."],2,"Group polarization is the tendency for group discussion to push members toward more extreme positions than they held individually.","Social and Multicultural","Groups can push each other toward extremes.","Group polarization","The tendency for groups to make more extreme decisions than individuals alone."],["Vision is to hearing as:",["temporal lobe is to occipital lobe.","occipital lobe is to parietal lobe.","parietal lobe is to occipital lobe.","occipital lobe is to temporal lobe."],3,"The lobes responsible for vision are the occipital lobes. The temporal lobes contain the primary auditory cortex. The parietal lobes process somatosensory information (e.g., touch, pain, temperature, and proprioception).","Biological Bases","Match the sense to the lobe.","Brain lobes and senses","The occipital lobe processes vision, the temporal lobe processes hearing."],["A psychiatrist requests patient records from a patient you saw seven years ago. The patient has signed the appropriate release. You should:",["refuse to send the records because the records are probably obsolete.","send any testing data, as well as the opening and closing summary, but leave out the session-by-session notes.","send the records with a note warning that the information may be obsolete.","attempt to dissuade the client from his request."],2,"Patients are entitled to have their records released to themselves or to someone they specify (e.g., a psychiatrist). The issue here is that the information is seven years old and might therefore be obsolete. So, this possibility should be noted when you send the records.","Ethics, Legal, Professional","Old records may no longer be true.","Releasing old records","Send with a note that the information may be out of date and should be interpreted accordingly."],["Single subject designs involve an approach that can be described as:",["ipsative.","idiographic.","normative.","nomothetic."],1,"Idiographic is the term used to describe single subject approaches while nomothetic describes group approaches. Normative data refer to data that can be compared both within and across subjects. Ipsative data, results from a forced-choice format.","Research and Statistics","One person at a time.","Idiographic approach","Studying an individual in depth, as single-subject designs do, rather than group averages."],["The most accurate statement regarding the relationship between mental illness and socioeconomic status (SES) is:",["SES and mental illness are positively correlated.","SES and mental illness are negatively correlated.","low SES has been shown to cause poorer mental health.","more rigorous studies have demonstrated that the supposed correlation between mental illness and SES was an artifact of poor research design."],2,"Not surprisingly, socioeconomic status is negatively correlated with mental illness. In other words, higher SES is associated with less mental illness, and lower SES is associated higher levels of mental illness. It has not been proven that low SES causes poor mental health, though some do contend this.","Social and Multicultural","Which way does the exam say the link goes?","SES and mental health","According to the exam key, low SES has been shown to cause poorer mental health. Other explanations are debated."],["Elizabeth Kubler-Ross described a sequence of stages people typically go through when confronted with a life- threatening illness. The first stage involves:",["anger.","disbelief.","bargaining.","superficial acceptance."],1,"Elizabeth Kubler-Ross' five stages are: denial, anger, bargaining, depression, and acceptance. These stages may be remembered by the acronym \"DABDA.\" The first stage of denial involves disbelief.","Growth and Lifespan","The first response is not acceptance.","Kubler-Ross stages","Denial (disbelief) comes first, then anger, bargaining, depression, and acceptance."],["The hardest behaviors to extinguish are those that are:",["reinforced on a consistent basis.","reinforced on a time-contingent basis.","reinforced on a variable basis.","reinforced every other time the behavior is emitted."],2,"The hardest behaviors to extinguish are those that are reinforced on an intermittent rather than continuous schedule of reinforcement. Of the intermittent schedules, the variable ratio is the most resistant to extinction, or hardest to extinguish. Assuming reinforcement occurred with every behavior, consistent reinforcement would be the easiest to extinguish.","Cognitive-Affective","Uncertain rewards keep behavior going.","Partial reinforcement extinction effect","Behaviors reinforced on variable schedules are the most resistant to extinction."],["Since you put in a tremendous amount of work, you decide to publish your dissertation as a journal article. You remember that your chairperson was a significant source of both moral and practical support, helping you with the data analysis, the literature review, and the summary of results. According to the Ethics Code, your chair should receive:",["first authorship.","second authorship.","a footnote.","an acknowledgment."],1,"Keep in mind when a dissertation is later published as a research article, the graduate student should almost always get first authorship. The question here addresses how the chairperson should be recognized, and given the significance of the contributions, the chair warrants a second authorship. Minor contributions to research should be acknowledged in a footnote or introductory statement.","Ethics, Legal, Professional","Give credit for a big contribution.","Authorship credit","Authorship reflects scientific contribution. A chair with a substantial contribution may be second author."],["Data from a study in which there are three levels of the independent variable and one continuous dependent variable should be analyzed using which of the following statistical methods?",["One-way anova.","Factorial anova.","Chi square.","Manova."],0,"To select the appropriate test of difference the first step is to get clarification on the independent and dependent variables.","Research and Statistics","Three groups, one continuous outcome.","One-way ANOVA","Compares the means of three or more groups on one dependent variable."],["DRO is based on:",["a combination of classical and operant conditioning.","a combination of punishment and reinforcement.","a combination of extinction and reinforcement.","a combination of positive and negative reinforcement."],2,"DRO, or differential reinforcement for other behaviors, combines operant extinction for an undesired behavior with reinforcement for more appropriate behavior. For example a child is ignored when she whines, and complimented when she politely asks for what she wants.","Treatment and Prevention","Reinforce anything except the problem.","DRO","Differential reinforcement of other behavior: reward the absence of the target behavior while ignoring the behavior itself."],["Damage to the temporal lobe is most likely to affect which type of memory function?",["Short-term explicit memory.","Long-term explicit memory.","Short-term implicit memory.","Long-term implicit memory."],1,"It is always difficult to make generalizations about complex functions like memory, but temporal lobe damage (and brain damage in general) does not typically result in damage to implicit memory. Implicit memory refers to memories that don’t require conscious recollection, like driving a car or playing the piano. Explicit memory involves the conscious recollection of facts and autobiographical events.","Biological Bases","Memory-related lobe by the ear.","Explicit memory","Conscious, long-term memory for facts and events, dependent on the temporal lobe and hippocampus."],["The belief that the nature of thought is influenced by the thinker's native language is basic to:",["the James-Lange theory.","the Sapir-Whorf hypothesis.","the Law of Effect.","the Law of Parsimony."],1,"The Sapir-Whorf hypothesis states that the language people use actually shapes how they think (e.g., English- speakers think about snow differently from the Eskimos since they have fewer words for it). James and Lange developed a theory about emotion, specifically that people infer their emotions from observing their behavior.","Growth and Lifespan","Language shapes thinking.","Sapir-Whorf hypothesis","The idea that the language you speak influences how you think."],["In comparing job enrichment to job enlargement:",["both would likely satisfy motivator needs.","job enrichment involves more responsibility while job enlargement increases variety.","job enrichment increases variety of tasks, while job enlargement increases decision-making.","both are thought to impact satisfaction and performance."],1,"Job enlargement simply involves increasing the variety of tasks, but not responsibility or degree of challenge. Research has found that job enlargement increases satisfaction but does not improve performance. In contrast, job enrichment involves increasing employees' responsibility and involvement.","Treatment and Prevention","One adds variety, one adds responsibility.","Job enrichment versus enlargement","Enlargement adds more tasks at the same level. Enrichment adds responsibility and challenge."],["Research has demonstrated that with regard to attachment behavior:",["infants seldom form attachment to more than one person during the first year of life.","attachment to the mother emerges primarily because of her association with food.","attachment patterns are not significantly related to coping with the \"Strange Situation.\"","by age one, most infants are securely attached."],3,"Some 60% or so of infants are securely attached by age one. Harlow's experiments with monkeys demonstrated that attachment, contrary to Freud's hypothesis, is not based on the fulfillment of drives such as hunger. The Strange Situation was developed by Ainsworth specifically to assess for quality of attachment.","Growth and Lifespan","Most babies bond securely.","Attachment security","About 60% or so of infants are securely attached by age one."],["An example of paradoxical intention is:",["sharing your angry feelings with clients to get them to express theirs.","prescribing the symptom.","getting the client to exaggerate his worst fears.","getting the agoraphobic to go to a shopping mall."],1,"Paradoxical intention involves having clients do the opposite of what they might expect. An example of this would be prescribing the symptom. For example, a couple whose primary complaint is that they argue too much may be given the homework of arguing two hours a day for the next week.","Treatment and Prevention","Tell them to do the very thing they fear.","Paradoxical intention","Frankl's technique of having the client deliberately do the problem behavior, such as prescribing the symptom."],["Studies of children identified as aggressive support which of the following conclusions?",["Aggression in early childhood is unrelated to aggression in middle childhood.","Childhood aggression rarely persists into adolescence.","Childhood aggression persists only if the children are abused.","There is a moderate tendency for the children to remain aggressive."],3,"If you were not familiar with this research, the best approach would be to combine conservatism with common sense. It seems unlikely that childhood aggression would be totally unrelated to adult aggression or rarely persist into adolescence.","Growth and Lifespan","Aggression tends to carry forward.","Continuity of aggression","Aggressive children show a moderate tendency to stay aggressive."],["The right hemisphere plays an important role in:",["language expression and reception.","logical analytic functions.","abstract thinking.","visuospatial organization."],3,"The right hemisphere is involved with perceptual, visuospatial, artistic, musical, and intuitive activities. The left hemisphere is involved with language, as well as with being rational, analytical, logical, and abstract.","Biological Bases","Space and shape, art and music.","Right hemisphere","Involved in visuospatial, artistic, musical, and intuitive functions."],["According to Kohlberg’s stages of gender identity, a child who identifies a boy with long hair as a girl, even though she sees him as a boy when his hair is short, is in what stage?",["Gender labeling.","Gender stability.","Gender consistency.","Gender confusion."],0,"Kohlberg outlined three stages of the development of gender identity in children. In the first stage, gender labeling, children identify others as male or female based on physical appearances such a clothing or hair style and do not recognize that gender is stable over time. Thus, as physical characteristics change (e.g., hair length), gender changes.","Social and Multicultural","The first of Kohlberg's three gender stages.","Gender labeling","The first stage: children label others as male or female from appearance and don't yet see gender as stable."],["Gestalt therapists believe that dreams are reflections of:",["unconscious aggressive and libidinal drives.","the collective unconscious.","aspects of the client.","the social environment."],2,"Gestalt therapists believe that different parts of a dream reflect different aspects of the person. They work with dreams by having the patient become each element of the dream. The notion that dreams reflect unconscious aggressive and libidinal drives would be most associated with Freudians or classical psychoanalysts.","Treatment and Prevention","Every part of the dream is you.","Gestalt dream work","The client plays each element of the dream to reveal parts of themselves."],["You have seen a family in treatment. The mother's lawyer contacts you at a later date, with a signed request for release of treatment information to be used in a custody battle. Based on your experience with the father, you know he has abused his children. Your best course of action would be to:",["release only the information that is necessary for the custody battle.","seek a release from the father, but if he refuses, release the information anyway since the children have been abused.","agree to release the information if you can evaluate the mother and children.","release the information only if the father consents as well."],3,"According to the Ethics Code, when multiple people have been in treatment, they all need to consent before confidential information may be released. In this scenario, consent from both the husband and wife is required. The abuse issue here is a red herring.","Ethics, Legal, Professional","More than one person was in treatment.","Release in family therapy","When several members were treated, all of them need to consent before information is released."],["When aversive counterconditioning is used to reduce certain sexual behaviors, the fetish object is:",["an unconditioned stimulus.","a conditioned stimulus.","an unconditioned response.","a conditioned response."],1,"This question is specifically asking about the fetish object, e.g., the shoe that someone is turned on by. The fetish object is a stimulus, while the response is most likely sexual excitement. To tease out whether it is an unconditioned or conditioned stimulus, you need only ask yourself whether the response is universal.","Treatment and Prevention","The fetish object is the trigger.","Aversive counterconditioning","The fetish object is a conditioned stimulus, because not everyone responds sexually to it."],["According to Fiedler's LPC theory:",["high LPCs do best in moderately favorable situations while low LPCs do best in either highly favorable or highly unfavorable situations.","low LPCs do best in moderately favorable situations while high LPCs do best in either highly favorable or highly unfavorable situations.","high LPCs do best in highly favorable situations, while low LPCs do best in unfavorable situations.","high LPCs are better at increasing satisfaction, while low LPCs are better at increasing productivity."],0,"This is another one of those things you just need to know. Fiedler's LPC theory states that high LPCs do best in moderately favorable situations, while low LPCs do best at the extremes (either highly favorable or highly unfavorable situations). This is a curvilinear relationship.","Treatment and Prevention","Match leader style to situation favorability.","Fiedler's contingency (LPC) model","High LPC (relationship-oriented) leaders do best in moderately favorable situations. Low LPC leaders do best at the extremes."],["The relationship between education and income among clinical psychologists is most likely:",["-.7.","0.0.",".3.",".5."],1,"In this situation, there is a full range of values for the variable income, but the variable education has a significantly restricted range, given that all psychologists have approximately 20 years of education. With a severely restricted range, a correlation becomes 0.","Research and Statistics","Everyone has about 20 years of school.","Restriction of range","If everyone has almost the same education, the correlation with income falls to about zero."],["The phenomenon of catharsis described in psychoanalytic theory, can be explained by behaviorists as:",["a decrease in affective response due to the therapist's direction to do so.","a decrease in affective response because of the therapist's indirect influences.","inhibited affective responding brought about by developing cognitive controls.","a decrease in affective response by extinction."],3,"Catharsis involves talking about anxiety-provoking situations and purging the associated emotions. A behaviorist would argue that catharsis works to reduce anxiety by a process of classical extinction. Catharsis would be seen as akin to flooding with response prevention in which the individual is exposed to the feared conditioned stimulus without the unconditioned stimulus being present, until the fear response is extinguished.","Treatment and Prevention","Behaviorists explain it without talking.","Extinction","Catharsis can be viewed as extinction: exposure to the feared cue without the aversive outcome reduces the emotional response."]];
