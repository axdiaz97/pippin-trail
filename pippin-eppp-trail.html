<style>
:root{--bg:#e9efdc;--card:#fffbee;--ink:#4b3a34;--ink2:#7b6a5f;--sage:#8fa97b;--line:#cdd6b8;--cap:#c9576a;--btn:#5f7d52;--btn-ink:#fffbee;--good:#dcebc8;--good-ink:#36592d;--bad:#f8dde0;--bad-ink:#8a3141;--butter:#f2d57e;--dot:rgba(75,58,52,.09);--rose:#e7a4ae;

body{margin:0;background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px,var(--dot) 1.2px,transparent 0);background-size:24px 24px;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5}

.wrap{max-width:520px;margin:0 auto;padding:16px 16px 48px}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.top{text-align:center;margin-bottom:6px}
.top h1{font-size:26px}

.hero{display:flex;gap:10px;align-items:flex-start;margin:14px 0}

.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}
.bubble{position:relative;flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;font-size:15px}
.bubble:before{content:"";position:absolute;left:-8px;top:24px;width:14px;height:14px;background:var(--card);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}

.bubble .q{margin:0;font-size:17px;font-weight:600;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}

.stat b{display:block;font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600}

.lvl{display:flex;align-items:center;gap:10px;width:calc(100% - 22px);margin:0 0 8px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);outline:1.5px dashed var(--sage);outline-offset:-6px;border-radius:16px;padding:10px 12px;text-align:left;cursor:pointer;font-size:15px}

.lvl .lt small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.3}
.lvl .stt{flex:none;font-weight:700;font-size:13px;color:var(--ink2)}
.lvl.done{border-color:var(--sage)}

.lvl.lock{opacity:.6}
.lvl.lock .bdg{filter:grayscale(1)}
.boss{width:100%;margin-left:0}
.note{min-height:22px;font-size:14px;color:var(--bad-ink);text-align:center;margin:4px 0}
.btn{display:inline-block;background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;cursor:pointer}
.gbtn{display:inline-block;background:transparent;color:var(--ink);border:1.5px dashed var(--sage);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px}

.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin:0 0 9px;font-size:15px;cursor:pointer}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt.ok{background:var(--good);border-color:var(--sage);color:var(--good-ink)}
.opt.no{background:var(--bad);border-color:var(--cap);color:var(--bad-ink)}
.opt.dim{opacity:.55}
.hintbox{background:var(--card);border:1.5px dashed var(--butter);border-radius:14px;padding:10px 12px;margin:0 0 10px;font-size:14.5px}
.fb{border-radius:14px;padding:12px 14px;margin:2px 0 12px;font-size:15px}
.fb b{display:block;font-family:'Fraunces',Georgia,serif;font-size:17px;margin-bottom:2px}
.fb.ok{background:var(--good);color:var(--good-ink)}
.fb.no{background:var(--bad);color:var(--bad-ink)}
.big{font-family:'Fraunces',Georgia,serif;font-size:44px;font-weight:600;line-height:1}
.center{text-align:center}
.field{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.lab{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
.foot{margin-top:26px;text-align:center;font-size:12.5px;color:var(--ink2)}
.link{background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:12.5px;cursor:pointer;padding:6px}
.tag{display:inline-block;background:var(--good);color:var(--good-ink);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700}

.ow{position:relative;margin:0 0 9px}
.ow .opt{margin:0;position:relative}
.ow.open .opt{border-bottom-left-radius:6px;border-bottom-right-radius:6px}
.opt .chev{margin-left:auto;flex:none;width:18px;height:18px;align-self:center;transition:transform .3s ease}
.ow.open .chev{transform:rotate(180deg)}
.ex{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
.ow.open .ex{grid-template-rows:1fr}
.exi{overflow:hidden}
.exc{background:var(--card);border:1.5px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:10px 12px 12px;font-size:14px;color:var(--ink)}
.exc p{margin:0 0 8px}
.exc p:last-child{margin:0}
.exc b{display:block;font-size:12px;color:var(--ink2);margin-bottom:1px}
.cap{font-size:13px;color:var(--ink2);margin:0 0 8px;text-align:center}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.045)}60%{transform:scale(.99)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}30%{transform:translateX(6px)}45%{transform:translateX(-5px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(143,169,123,0)}40%{box-shadow:0 0 0 6px rgba(143,169,123,.5)}100%{box-shadow:0 0 0 0 rgba(143,169,123,0)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-16px) scale(1.06,.94)}50%{transform:translateY(0) scale(.95,1.05)}70%{transform:translateY(-8px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}45%{transform:rotate(7deg)}70%{transform:rotate(-4deg)}}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1) rotate(200deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ow.pop{animation:pop .5s ease}
.ow.shake{animation:shake .5s ease}
.ow.glow .opt{animation:glow 1.1s ease .25s}
.hop{animation:hop .8s ease 1;transform-origin:50% 100%}
.wobble{animation:wobble .7s ease 1;transform-origin:50% 100%}
.fb{animation:rise .35s ease .1s both}
.burst{position:absolute;left:50%;top:24px;width:0;height:0;pointer-events:none;z-index:3}
.burst i{position:absolute;left:0;top:0;font-style:normal;font-size:19px;animation:fly .95s ease-out forwards}
@media (prefers-reduced-motion:reduce){.ow.pop,.ow.shake,.ow.glow .opt,.hop,.wobble,.fb{animation:none}.burst{display:none}.ex{transition:none}.opt .chev{transition:none}}

.mrow{display:flex;gap:10px;align-items:center;margin:8px 0}
.mrow .mm{flex:none;width:44px;height:44px}
.clue{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px dashed var(--butter);border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:14.5px;animation:rise .4s ease .3s both}
.clue .cm{flex:none;width:44px;height:44px}
.clue b{display:block;font-family:'Fraunces',Georgia,serif;font-size:15px;margin-bottom:2px}
.clue .old{color:var(--ink2);font-size:13px}
.gcard{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin:0 0 10px}
.gcard.hl{border-color:var(--sage);outline:1.5px dashed var(--sage);outline-offset:-6px}
.gcard .ga{flex:none;width:64px;height:64px}
.gcard h3{font-size:16px}
.gcard small{color:var(--ink2);font-size:12.5px;display:block;margin:1px 0 4px}
.gcard p{margin:0;font-size:14px}
.gcard ol{margin:4px 0 0;padding-left:18px;font-size:14px}
@keyframes reveal{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:scale(1.18) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.revealart{display:inline-block;animation:reveal .95s cubic-bezier(.2,.9,.3,1.2) both}
.wig{display:inline-block;animation:wig 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.revealart,.wig,.clue{animation:none}}

.mcard{display:flex;gap:12px;align-items:center;margin-top:12px}
.mcard .msil{flex:none;width:88px;height:88px}
.sil{display:inline-block;filter:brightness(0);opacity:.3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sil{filter:brightness(0) invert(1);opacity:.28}}
:root[data-theme="dark"] .sil{filter:brightness(0) invert(1);opacity:.28}
.facts{list-style:none;margin:6px 0 0;padding:0;font-size:14px}
.facts li{margin:0 0 5px}
.facts b{display:block;font-size:12px;color:var(--ink2)}
.hype{margin:8px 0 0;font-size:13.5px;color:var(--ink2)}
.gcard .gbtn{padding:6px 14px;font-size:13px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var CAPS=["#e3cfa8","#f0a94b","#a97c5c","#cfc8bb","#8f6240","#c0703c","#f4ecd6","#a4735a","#d3453f","#f6f0e2"];
var LEVELS=[
{id:1,name:"Mossy Gate",sub:"Attributions and heuristics",t:"Heider, Kelley, Weiner, attribution biases, availability, representativeness, and simulation heuristics, Kelly's personal construct theory.",q:[
["A student fails an exam and says, “The test was unfair.” What kind of attribution is this?","Situational (external)",["Dispositional (internal)","Stable internal","Unstable internal"],"Where does the student put the cause: inside themselves or outside?","Heider: situational attributions place the cause outside the person, like an unfair test. Dispositional ones place it inside, like lack of effort."],
["Which three types of information does Kelley say people use when making attributions?","Consistency, distinctiveness, and consensus",["Stability, locus, and control","Salience, primacy, and recency","Ability, effort, and luck"],"Think C, D, C.","Harold Kelley: consistency (same over time?), distinctiveness (only in this situation?), and consensus (do others act this way?). Stability was Weiner's addition."],
["A coworker is rude every day, in every setting, and nobody else at work is rude. Kelley predicts what kind of attribution?","Internal (dispositional)",["External (situational)","Unstable external","No attribution is possible"],"High consistency, low distinctiveness, low consensus.","High consistency plus low distinctiveness plus low consensus points inward. When all three are high, people lean external."],
["Weiner added a second dimension to attribution theory. What is it?","Stability (stable vs. unstable)",["Controllability","Consensus","Salience"],"Does the cause stay the same over time?","Weiner (1974): stable internal = lack of ability; unstable internal = lack of effort; stable external = bad economy; unstable external = bad luck."],
["An unemployed person blames the poor economy. Using Weiner's model, this is which kind of cause?","Stable external",["Unstable external","Stable internal","Unstable internal"],"Outside the person, and not going away soon.","A poor economy is outside the person and lasts a while, so it is stable external. Bad luck would be unstable external."],
["Which bias is the tendency to explain another person's behavior by their disposition while underestimating the situation, and often leads to “blaming the victim”?","Fundamental attribution bias",["Self-serving bias","Actor-observer bias","Availability heuristic"],"It's about someone else's behavior only.","Fundamental attribution bias (Jones and Nisbett, 1971). Dispositional factors are more salient than situational ones."],
["You credit your talent when you ace a test but blame the professor when you bomb one. Which bias is this?","Self-serving (hedonic) bias",["Fundamental attribution bias","Actor-observer bias","Simulation heuristic"],"Successes are mine, failures aren't.","Self-serving bias: successes go to internal factors, failures to external ones, protecting self-esteem."],
["Which bias has people attribute their own actions to the situation but other people's actions to their dispositions?","Actor-observer bias",["Self-serving bias","Fundamental attribution bias","Representativeness heuristic"],"It covers your behavior AND another's, when both fail.","Actor-observer bias. One explanation is that we know more about ourselves than about others."],
["People rate death by firearms as more common than death from asthma because gun deaths get more publicity. Which heuristic is this?","Availability heuristic",["Representativeness heuristic","Simulation heuristic","Anchoring heuristic"],"How easily can you recall examples?","Availability: we estimate likelihood by how easily examples come to mind."],
["People who hear about rape or spousal abuse usually assume the victim is female and the perpetrator male. Which heuristic is this?","Representativeness heuristic",["Availability heuristic","Simulation heuristic","Halo effect"],"Judging by what seems like the “typical” example.","Representativeness: judging people or events by how well they match a typical example of a category."],
["Physicians who imagined catching AIDS from patients believed they were at greater risk than those who hadn't. Which heuristic?","Simulation heuristic",["Availability heuristic","Representativeness heuristic","Fundamental attribution bias"],"They built mental images and used them to judge.","Simulation: people develop mental images of situations and use them to make judgments about real facts."],
["George Kelly's Personal Construct Theory describes ordinary people as:","Scientists who form, test, and revise hypotheses",["Passive responders to reinforcement","Driven by unconscious conflicts","Motivated mainly by consistency"],"Picture a lab coat.","Kelly: people are active and future-oriented, constantly testing their expectations. The Repertory Grid maps a client's constructs."]
]},
{id:2,name:"Buttercup Meadow",sub:"Attitudes and dissonance",t:"Attitude components, LaPiere, balance and symmetry theories, cognitive dissonance and its four types, self-perception, overjustification, self-verification.",q:[
["Which are the three components of an attitude?","Cognitive, affective, and behavioral",["Perceptual, motivational, and social","Conscious, preconscious, and unconscious","Central, peripheral, and situational"],"Thoughts, feelings, actions.","Thoughts and beliefs (cognitive), feelings (affective), and predispositions to act (behavioral). They correlate only weakly with behavior (about .15)."],
["LaPiere traveled with a Chinese couple and nearly every restaurant served them, yet 90% later said they wouldn't serve Asians. Which concept helps explain the gap?","Situational constraint",["Cognitive dissonance","Reactance","Overjustification"],"Maybe they feared making a scene.","Situational constraint: the owners may have feared making a scene in front of other customers."],
["Joe and Beth like each other. Joe likes a candidate; Beth strongly dislikes the candidate. According to balance theory, this state is:","Imbalanced",["Balanced","Congruent","Symmetrical"],"Two positive elements and one negative.","Heider's balance theory: all positive, or one positive and two negative, is balanced. Two positive and one negative is imbalanced, so someone will change their feelings."],
["Which theory extends balance theory by considering the intensity of the relationship?","Symmetry theory (Newcomb)",["Congruity theory (Osgood)","Self-verification theory","Reactance theory"],"A stronger bond means stronger pressure to fix the imbalance.","Symmetry theory: the stronger the friendship, the more intense the imbalance is felt and the greater the attitude change."],
["According to cognitive dissonance theory, when people act against their attitudes they tend to:","Change their attitudes to match their actions",["Change their actions to match their attitudes","Ignore the inconsistency","Seek others who disagree"],"The discomfort gets resolved in the mind.","Festinger (1957): people reduce aversive arousal by changing attitudes to fit what they did."],
["In Festinger and Carlsmith's study, who reported liking the dull task more?","Participants paid $1",["Participants paid $20","Both groups equally","Neither group; all disliked it"],"Less justification means more dissonance.","The $1 group had insufficient external justification for lying, felt more discomfort, and changed their attitude more."],
["After choosing between two good options, someone dwells on the positives of the one they picked. This is:","Postdecisional dissonance",["Effort justification","Insufficient deterrence","Overjustification"],"Regret over the road not taken.","Postdecisional dissonance: upset at not choosing the other option, the person emphasizes the positives of their choice."],
["After working very hard for a goal that turned out not so worthwhile, someone insists it was great. This is:","Effort justification",["Postdecisional dissonance","Insufficient justification","Insufficient deterrence"],"All that effort has to have been worth it.","Effort justification: the person emphasizes the positive qualities of the goal to justify the effort."],
["Someone skips a desirable action because of a small threat, then starts emphasizing the action's negatives. This is:","Insufficient deterrence",["Insufficient justification","Effort justification","Postdecisional dissonance"],"Small deterrent, so the mind adds its own reasons.","Insufficient deterrence: a small deterrent leads the person to emphasize the negative aspects of the action they avoided."],
["Which phrase sums up Bem's self-perception theory?","“I did it, so I believe it!”",["“I believe it, so I did it!”","“I feel uneasy, so I must change.”","“They expect it, so I'll do it.”"],"You watch your own behavior like an outsider would.","People infer attitudes from their own behavior, with no aversive arousal needed. It fits best when current behavior matches past behavior; dissonance fits when there's a discrepancy."],
["A child who loves reading gets rewarded for each book, then reads less once the rewards stop. Which idea explains this?","Overjustification hypothesis",["Cognitive dissonance","Behavioral confirmation","Reactance"],"Too much external reward crowds out inner motivation.","Overjustification: too much external justification undermines intrinsic motivation."],
["Depressed people who discount positive feedback and seek feedback that confirms a negative self-view illustrate:","Self-verification theory",["Self-enhancement theory","Behavioral confirmation","Congruity theory"],"People want their self-concept confirmed, even a negative one.","Swann's self-verification theory is the most robust of the self-concept theories, especially when the self-concept is well established."]
]},
{id:3,name:"Whispering Willow",sub:"Persuasion and conflict",t:"Source, message, and audience factors, primacy and recency, reactance, elaboration likelihood model, inoculation, and the three types of conflict.",q:[
["To persuade someone about an unimportant matter (like cereal), a source is most effective when they are:","Likable, similar, and attractive",["Highly credible and prestigious","Intimidating and forceful","Anonymous"],"Think of models in TV commercials.","On unimportant matters, likability, similarity, and attractiveness matter most."],
["On important, deeply held convictions, the most important source characteristic is:","Credibility (trustworthiness and expertise)",["Physical attractiveness","Similarity to the audience","Likability"],"Would you trust them, and do they know their stuff?","Credibility = trustworthiness plus expertise."],
["People forget who said a message over time but remember the message itself. This is the:","Sleeper effect",["Primacy effect","Recency effect","Halo effect"],"The source falls asleep, the message stays awake.","Sleeper effect: source credibility fades while the message is remembered."],
["For a fear appeal to work, it must:","Create a lot of fear, be believable, and offer specific instructions",["Create mild fear and be vague","Avoid offering solutions","Come from a likable source only"],"Scare them, convince them, then tell them what to do.","Recent research: high fear, believable message, and specific instructions for avoiding the danger."],
["A long gap separates two speeches and the decision. Whose message is remembered best?","The speaker who goes first (primacy)",["The speaker who goes last (recency)","The middle speaker","Neither"],"Long gap, long first. Short gap, short last.","Primacy for long gaps; recency when the gap is only a few days."],
["Hovland found presenting both sides works best when the listener is:","Initially opposed, well informed, and intelligent",["Initially in favor, poorly informed","Undecided and uninterested","Emotional and distracted"],"Smart skeptics.","Present one side when the listener already favors the argument and is poorly informed."],
["According to reactance theory, when people feel their freedom is threatened they:","Resist and refuse to comply",["Comply more quickly","Change attitudes to match behavior","Seek expert advice"],"Push harder and they push back.","Coercion or a “hard sell” triggers reactance; the stronger the coercion, the stronger the resistance."],
["In the elaboration likelihood model, being swayed by the speaker's attractiveness or “beautiful people don't lie” reflects which route?","Peripheral route",["Central route","Inoculation route","Dissonance route"],"Focus on things off to the side of the message.","Peripheral route: cues like attractiveness, expertise, and similarity rather than the message itself."],
["Which route to persuasion produces attitude change that is enduring, resists further change, and predicts behavior?","Central route",["Peripheral route","Reactance route","Sleeper route"],"Thinking deeply about the arguments.","Central route takes ability and motivation to elaborate on the message's arguments."],
["Giving someone a mild argument against a belief so they can practice refuting it, like a vaccine, is called:","Inoculation",["Reactance","Foot-in-the-door","Overjustification"],"A weak dose builds antibodies.","Inoculation increases resistance to later, stronger persuasion."],
["A couple weighing a child, which will enrich their lives but cost free time, faces which conflict?","Approach-avoidance",["Approach-approach","Avoidance-avoidance","Double-bind"],"One choice with both good and bad results.","Approach-avoidance: ambivalence, since one option has desirable and undesirable results."],
["In “Sophie's Choice,” a soldier demands she give up her son or her daughter. Which conflict is this?","Avoidance-avoidance",["Approach-approach","Approach-avoidance","Double approach"],"Both options are terrible.","Avoidance-avoidance is the most difficult to resolve and generates the most stress. People often choose “the lesser of two evils” or escape."]
]},
{id:4,name:"Bramble Hollow",sub:"Prejudice and emotion",t:"Components and sources of prejudice, reducing prejudice (Robbers Cave), James-Lange, Cannon-Bard, and Schachter's two-factor theory.",q:[
["Prejudice has cognitive, affective, and behavioral elements. Which one includes discrimination?","Behavioral",["Cognitive","Affective","Perceptual"],"Actions.","Cognitive = stereotypes and beliefs; affective = feelings; behavioral = predispositions to act, such as discrimination."],
["According to the chapter, prejudices can be learned through:","Classical and operant conditioning and social learning",["Direct contact with outgroups only","Genetic inheritance","Authoritarian parenting only"],"The same ways other attitudes are learned.","Learned prejudice follows the same learning pathways as other attitudes."],
["“They all look alike to me” reflects which cognitive bias?","Outgroup homogeneity effect",["Ingroup favoritism","Fundamental attribution bias","Halo effect"],"Seeing more diversity among “us” than “them.”","Outgroup homogeneity: seeing more diversity in one's ingroup than in the outgroup."],
["Adorno linked prejudice to which personality trait, measured by the F scale?","Authoritarianism",["Neuroticism","Narcissism","Extraversion"],"Domineering fathers, punitive mothers.","High F-scale scorers displace anger toward parents onto anyone deviant, disobedient, or from a minority group."],
["Which finding supports the idea that prejudice grows from competition for limited resources?","Lower-class whites hold more racist attitudes than higher-class whites",["Higher-class whites hold more racist attitudes","Racism is equal across classes","Minorities are more prejudiced toward whites"],"Who feels threatened by minority competition?","Lower-class whites may feel more threatened by minority competition."],
["Scapegoating innocent victims when the real source of frustration is ambiguous or too powerful is:","Displaced aggression",["Learned prejudice","Outgroup homogeneity","Authoritarianism"],"Frustration finds an easier target.","Displaced aggression: people scapegoat when the frustration source is bigger, capable of retaliating, or ambiguous."],
["In Sherif's Robbers Cave study, what reduced hostility between rival groups of boys?","Cooperation on tasks needing both groups",["More competition","Punishing aggression","Keeping the groups apart"],"Prizes for everyone.","Cooperation, especially around superordinate goals, eliminated the prejudice that competition had created."],
["What are superordinate goals?","Goals achievable only if both groups work together",["Goals each group can reach alone","Goals set by an authority figure","Goals that reward the stronger group"],"They benefit both parties.","Higher than individual goals and of benefit to both groups."],
["Which theory says, “I'm running and my heart is pounding, so I must be afraid”?","James-Lange",["Cannon-Bard","Schachter's two-factor","Opponent-process"],"Body first, then emotion.","James-Lange: emotion results from perceiving bodily reactions. Research hasn't supported it."],
["Which theory says emotion and bodily reactions happen at the same time?","Cannon-Bard",["James-Lange","Schachter's two-factor","Self-perception"],"Signals go to the hypothalamus and limbic system together.","Cannon-Bard: messages go simultaneously to the hypothalamus (arousal) and limbic system (subjective feeling)."],
["A racing heart at the Olympics is labeled “excitement,” but at a licensing exam it's labeled “anxiety.” Which theory?","Schachter's two-factor theory",["James-Lange","Cannon-Bard","Self-verification"],"Arousal plus a label from the context.","Emotion = physiological arousal + cognitive labeling based on the environment."],
["In Schachter and Singer's epinephrine study, who looked to the environment to decide how they felt?","Those not told about the drug's effects",["Those accurately informed about the effects","Those who received no injection","Those tested alone"],"They lacked a label for their arousal.","Uninformed subjects took cues from confederates and reported feeling happy or unhappy accordingly."]
]},
{id:5,name:"Honeysuckle Lane",sub:"Attraction, aggression, helping",t:"Impression formation, Rosenhan, social comparison, attraction factors, social exchange, bystander apathy, and theories of aggression.",q:[
["Who is viewed more favorably: a person who seems competent first and then errs, or one who fails first and then succeeds?","The one who seems competent first",["The one who fails first","Both equally","It depends on the observer's gender"],"First impressions stick.","Primacy effect: people hold on to information presented first."],
["In Rosenhan's (1973) study, pseudopatients faked one symptom, were admitted, then acted normally. What did it show about person perception?","Social context and labels shape how people are perceived",["Psychiatrists easily detect faking","Schizophrenia is rarely misdiagnosed","Context has little influence"],"Staff kept seeing patients.","Once labeled, they were treated as patients (average stay 19 days)."],
["When no objective standard exists, people evaluate themselves by:","Comparing themselves to others",["Asking authority figures","Reflecting on their own past","Ignoring feedback"],"Look around.","Social comparison theory: we compare to those similar, slightly better, or slightly worse."],
["Which hypothesis says people of about equal physical attractiveness tend to pair up?","Matching hypothesis",["Similarity hypothesis","Reciprocity hypothesis","Need complementarity"],"Like matches like in looks.","People prefer attractive partners, but tend to select someone about equally attractive."],
["Proximity promotes attraction mainly because of:","Mere exposure (familiarity)",["Need complementarity","Reciprocity","Shared values"],"The more you see, the more you like.","Familiarity strongly enhances attractiveness and liking."],
["Choosing a partner who differs from you in personality in a complementary way is called:","Need complementarity",["The similarity hypothesis","The matching hypothesis","Social exchange"],"Opposites attract.","Similarity in background and values cements relationships, but opposites can attract on personality."],
["According to social exchange theory, what happens when costs outweigh rewards in a relationship?","Attraction declines",["Attraction increases","Nothing changes","Reciprocity increases"],"Think reward-to-cost ratio.","People pick the partner with the most favorable reward-to-cost ratio."],
["Schachter (1959) found people expecting a painful shock chose to wait with others. His conclusion was:","Misery loves miserable company",["Misery loves any company","Anxiety reduces affiliation","Opposites attract"],"Not just any company.","Arousal heightens attraction, particularly to others in the same boat."],
["Bystander apathy most likely results from:","Diffusion of responsibility",["Deindividuation","Reactance","Groupthink"],"Someone else will handle it.","A person is most likely to get help when there is only one bystander."],
["Dollard's hypothesis says aggression:","Is always due to frustration, and frustration always leads to aggression",["Is innate and instinctual","Is learned by watching models","Is driven mainly by testosterone"],"Blocked goals lead to aggression.","Frustration-aggression hypothesis (1939). Tests have produced conflicting results."],
["Which theory says we learn to be aggressive by watching models and seeing others rewarded for aggression?","Social learning theory",["Frustration-aggression hypothesis","Instinct theory","Biological theory"],"Monkey see, monkey do.","Considerable evidence that media can contribute to aggression; TV violence increased aggressiveness in children."]
]},
{id:6,name:"Stonewall Orchard",sub:"Conformity and obedience",t:"Sherif, Asch, normative and informational influence, reference groups, idiosyncrasy credits, minority influence, Milgram.",q:[
["Conformity is:","Changing one's behavior because of real or imagined group pressure",["Following a direct command from an authority","Adopting a group identity and losing self-awareness","Refusing to comply when freedom feels threatened"],"Peer pressure.","Two classic studies: Sherif (1935) and Asch (1951)."],
["Sherif's study of a stationary light seeming to move in a dark room demonstrated the:","Autokinetic effect, with judgments converging on the group norm",["Autokinetic effect, with judgments staying independent","Halo effect","Sleeper effect"],"Auto-kinetic, self-moving.","Subjects tested alone changed their judgments the second time to match the group."],
["In Asch's line-judgment study with confederates giving wrong answers, about how many subjects conformed?","About one-third",["About 65%","About 10%","Nearly all"],"Not Milgram's number.","Asch also found group size and unanimity matter; conformity peaked with 7 unanimous people."],
["Choosing clothes like your friends wear is an example of:","Normative social influence",["Informational social influence","Idiosyncrasy credits","Reactance"],"The need for approval and acceptance.","Normative influence: pressure to conform based on a need for the group's approval."],
["You buy ski equipment because an avid skier friend recommended it. Which influence is this?","Informational social influence",["Normative social influence","Idiosyncrasy credits","Deindividuation"],"They probably know more than you.","Informational influence assumes the other person has more information."],
["Buying Wheaties because a famous athlete endorses it reflects:","Reference group influence",["Normative pressure from peers only","Reactance","Groupthink"],"People we admire and want to resemble.","Reference groups include athletes, movie stars, parents, teachers, and friends."],
["A group is more tolerant of a member who deviates if that member previously conformed. This is:","Idiosyncrasy credits",["Reactance","Social loafing","Risky shift"],"Earning tolerance.","Idiosyncrasy credits can be earned by initially conforming to group norms."],
["A minority-opinion member is most likely to influence the group when they:","Persist, stay firm yet flexible, and are logically consistent",["Give in early to build trust","Argue loudly and aggressively","Change their view often"],"Consistent and coherent.","Persuasiveness also rises when the position fits the group's social culture."],
["In Milgram's obedience studies, about what percentage of subjects gave the most severe shocks?","65%",["10%","33%","95%"],"About two-thirds.","Key factors: authority, placement of responsibility, and gradualism."],
["Milgram's gradually increasing shock levels may have worked as which technique?","Foot-in-the-door",["Door-in-the-face","Low-ball","Bait and switch"],"A small first request, then more.","Once a participant complied initially, they may have felt trapped by their behavior and the situation."],
["Which factor is shown to reduce obedience?","Witnessing a disobedient model",["Increasing the authority's status","Escalating demands gradually","Making the task feel more important"],"Seeing someone else say no.","A disobedient model makes disobedience possible."]
]},
{id:7,name:"Hearthside Circle",sub:"Groups",t:"Additive, disjunctive, and conjunctive tasks; Zimbardo; deindividuation; risky shift; polarization; groupthink; social facilitation, inhibition, and loafing.",q:[
["Scientists and engineers combine talents to build a space shuttle. Which task type is this?","Additive",["Disjunctive","Conjunctive","Compensatory"],"Individual efforts are added together.","Additive: members' separate performances add up to a combined effect."],
["A group's outcome depends on its single most effective member, such as one person with an outstanding idea. Which task?","Disjunctive",["Additive","Conjunctive","Reciprocal"],"The best person carries the group.","Disjunctive: the outcome is affected by the most effective member."],
["A quality-control team makes errors because one member sleeps on shift. Which task?","Conjunctive",["Additive","Disjunctive","Cooperative"],"The weakest link.","Conjunctive: accomplishment is limited by the least effective member."],
["Zimbardo's Stanford prison study showed that:","Assigned roles can powerfully shape behavior",["Personality alone predicts abusiveness","People resist roles that are randomly assigned","Anonymity is required for cruelty"],"Guards and prisoners absorbed in their roles.","The study was stopped after six days; guards abused power and prisoners grew depressed."],
["In Zimbardo's (1970) hooded-coat study, what was the critical factor in deindividuation?","Anonymity, not just group membership",["Group size","Obedience to authority","Prior aggression"],"Women in costume vs. women with name tags.","Deindividuation suspends private self-identity for the group's identity, with less self-awareness and self-regulation."],
["People in groups making riskier decisions than they would alone is called:","Risky shift",["Response polarization","Groupthink","Deindividuation"],"Pooling money for investments.","Because of it, groups can be more creative and innovative."],
["Someone opposed to abortion joins like-minded people and becomes more strongly opposed. This is:","Response (group) polarization",["Risky shift","Groupthink","Social loafing"],"Views get more extreme.","Group polarization: people in groups tend to become more extreme in their views."],
["A cohesive group seeks unanimity over the best alternative and dismisses warnings, as before Pearl Harbor. This is:","Groupthink",["Risky shift","Group polarization","Social inhibition"],"Everyone thinks alike.","Groupthink: group members lose critical evaluative capacities due to pressure to conform."],
["Performance improves just because others are present, most often on simple or familiar tasks. This is:","Social facilitation",["Social inhibition","Social loafing","Risky shift"],"Easy task, audience helps.","Social facilitation."],
["Performance suffers because of others' presence when the task is novel or complex. This is:","Social inhibition",["Social facilitation","Social loafing","Groupthink"],"Hard task, audience hurts.","Social inhibition."],
["People work less hard in a group than alone, especially when their efforts are anonymous. This is:","Social loafing",["Social inhibition","Diffusion of responsibility","Deindividuation"],"Nobody can tell who did what.","Social loafing occurs when individual efforts won't be evaluated."]
]},
{id:8,name:"Lantern Bridge",sub:"Acculturation, health, SES",t:"Immigration stress, enculturation, Berry's four strategies, health care use, cultural concepts of distress, cultural encapsulation and competence, SES.",q:[
["When do psychiatric problems tend to peak after immigration?","One to three years after immigrating",["Immediately on arrival","Five to ten years later","They steadily decline"],"Not right away, not forever.","Immigration is itself a significant stressor; families often acculturate at different rates."],
["Enculturation is:","Learning one's own culture, mainly through home and family",["Adopting another group's beliefs","Integrating two cultural identities","Losing one's cultural identity"],"Culture from the inside.","Acculturation is learning another group's culture; enculturation is learning your own."],
["Berry: individuals who do NOT maintain their cultural identity but DO seek regular contact with other cultures use which strategy?","Assimilation",["Separation","Integration","Marginalization"],"Blend into the dominant culture.","Assimilation may show up as changed language preference and loss of separate ethnic identification."],
["Berry: individuals who value their original culture and avoid interaction with other cultures use which strategy?","Separation",["Assimilation","Integration","Marginalization"],"Keep your own, avoid others.","Separation."],
["Berry: individuals who maintain their original culture while also interacting with other cultures use which strategy?","Integration",["Assimilation","Separation","Marginalization"],"Best of both.","Integration is the most bicultural strategy."],
["Berry: individuals who neither maintain their cultural identity nor seek interaction with other cultures use which strategy?","Marginalization",["Assimilation","Separation","Integration"],"Neither one.","Marginalization."],
["Why might minorities avoid mental health services?","Distrust of providers, or seeing therapy as an instrument of oppression",["Higher rates of private insurance","Better access to private physicians","Lower stigma"],"Trust issues.","Minorities are underrepresented in mental health care and over-rely on ER visits."],
["Ataque de nervios is an example of a:","Cultural syndrome",["Cultural idiom of distress","Cultural explanation","Somatic symptom disorder"],"A recognized cluster of symptoms in a community.","Cultural syndromes are clusters of attributions and symptoms recognized as a pattern in specific groups."],
["Contemporary theorists view a preference for presenting somatic complaints as:","A sociocultural phenomenon, not defensiveness",["A sign of defensiveness","A lack of psychological sophistication","Evidence of a somatic symptom disorder"],"Culture, not a flaw.","Somatization is a common idiom of distress."],
["A therapist who makes narrow assumptions, minimizes cultural variation, and judges clients by their own criteria is:","Culturally encapsulated",["Culturally competent","Using an emic approach","Using a multisystems approach"],"Trapped in their own cultural bubble.","Cultural encapsulation can impede effective therapy with minority clients."],
["Cultural competence requires therapists to:","Know their own values and the client's culture, and build skills",["Only see same-ethnicity clients","Apply universal (etic) principles consistently","Avoid discussing culture"],"Self-awareness plus client-awareness.","Consider clients' languages, histories, traditions, and values."],
["Patients with identical symptoms were diagnosed schizophrenic if low SES but bipolar if higher SES. This suggests:","Diagnostic procedures may be biased",["Low SES causes schizophrenia","Bipolar disorder occurs only in high SES","Symptoms differ by SES"],"Same symptoms, different labels.","It's still controversial whether SES causes illness, illness causes lower SES, or diagnosis is biased."]
]},
{id:9,name:"Lavender Hill",sub:"Identity models and communication",t:"Emic vs. etic, communication styles, the Minority Identity Development Model, Cross's model, Helms's white identity model, Troiden's model.",q:[
["Which pairing is right?","Etic = universal view; emic = culture-specific view",["Etic = culture-specific; emic = universal","Both mean culture-specific","Both mean universal"],"ETic = ETernal truths; eMic = Multicultural.","Psychology historically took an etic view, but an emic perspective is increasingly encouraged."],
["Middle-class white American culture tends to value which communication style?","Low-context (“say what you mean”)",["High-context","Nonverbal only","Indirect"],"Be direct.","Low-context communication: meaning is in the words actually said."],
["A hesitant “yes” from a Filipino client that really means a polite refusal reflects:","High-context communication",["Low-context communication","Cultural paranoia","Somatization"],"The situation and nonverbal cues matter.","High-context: the same words can mean different things depending on how and when they're said."],
["Minority Identity Development Model: which stage has the person preferring the dominant culture and holding negative attitudes about their own group?","Conformity",["Dissonance","Resistance","Introspection"],"Stage one: fit in with the dominant culture.","Conformity is stage one."],
["Which stage begins to appreciate the minority culture and question the dominant culture's values?","Dissonance",["Conformity","Resistance","Synergetic articulation"],"Old and new attitudes clash.","Dissonance is stage two."],
["Which stage has the person completely endorsing minority views and rejecting dominant values, with racial pride replacing self-hatred?","Resistance (immersion)",["Conformity","Introspection","Dissonance"],"Accepting the minority, rejecting the dominant.","Resistance is stage three."],
["The person finds intense negative feelings toward white society draining and sees that much of white U.S. culture is functional. Which stage?","Introspection",["Resistance","Dissonance","Conformity"],"Looking within.","Introspection is stage four."],
["The final stage of the Minority Identity Development Model, being both appreciative and critical of all cultures, is:","Synergetic articulation and awareness",["Introspection","Internalization","Autonomy"],"Both cultures.","Also called integrative awareness."],
["In Cross's model of Black identity development, which stage is similar to conformity?","Preencounter",["Encounter","Immersion-emersion","Internalization"],"Before the encounter.","Preencounter ≈ conformity; encounter ≈ dissonance; immersion-emersion ≈ resistance."],
["In Helms's White Racial Identity model, which stage involves endorsing white racial superiority?","Reintegration",["Contact","Pseudo-independence","Autonomy"],"Not the happy kind of “integration.”","Reintegration: the person accepts white superiority and other groups' inferiority."],
["Which Helms stage has whites questioning that Blacks are innately inferior and trying to disavow their whiteness, leading to alienation?","Pseudo-independence",["Disintegration","Immersion/emersion","Contact"],"Fake independence from their own whiteness.","Stage four; often resulting in alienation from whites and suspicion from people of color."],
["Troiden's gay and lesbian identity model: the first stage, occurring before puberty and focused more on gender, is:","Sensitization",["Identity confusion","Identity assumption","Commitment"],"Feeling different from peers.","Sensitization is stage one."],
["Troiden's stage around ages 17 to 18, in which people cope through denial, avoidance, or repair, is:","Identity confusion",["Sensitization","Identity assumption","Commitment"],"Growing recognition, lots of conflict.","Identity confusion is stage two. Stage three is identity assumption; stage four is commitment."]
]},
{id:10,name:"Village Green",sub:"Cultural groups and treatment",t:"Hispanic, African American, Asian American/Pacific Islander, and Native American populations: mental health issues and treatment implications.",q:[
["Hispanic culture is generally considered:","Collateral, valuing family and social connectedness",["Individualistic","Lineal, with strict lines of authority","Low-context"],"Family first.","Collateral as opposed to individualistic."],
["Bilingual Hispanic patients evaluated in English, compared with Spanish, tend to be seen as having:","More psychopathology",["Less psychopathology","The same level","More resilience"],"Language can distort assessment.","About 40% of the Hispanic population isn't fluent in English, a barrier to services."],
["Which treatment style is generally recommended for Hispanic clients?","Active, concrete, and problem-solving; family approaches are often useful",["Passive and non-directive","Purely insight-oriented","Individual-only work"],"Personalismo: informal and personal.","Hispanic clients often respond best to informality, chit-chat, and individual attention."],
["“Cultural paranoia” refers to:","A healthy suspiciousness based on real experiences of racism",["Functional (psychiatric) paranoia","A delusional disorder common in African Americans","Distrust of only medical providers"],"Not a disorder.","Distinct from psychiatric paranoia, which is considered a mental disorder."],
["African Americans tend to be:","Overdiagnosed with schizophrenia and underdiagnosed with bipolar disorder",["Underdiagnosed with schizophrenia and overdiagnosed with bipolar","Diagnosed accurately in most studies","Overdiagnosed with anxiety disorders"],"Bias in diagnostic labeling.","African Americans are underrepresented in outpatient care but overrepresented in inpatient treatment."],
["Which is true about African Americans in therapy?","They tend to terminate earlier, so build a positive alliance and keep the relationship egalitarian",["They rarely hold positive attitudes toward counseling","They stay longer than other groups","They do best with a purely non-directive stance"],"Trust develops when the therapist conveys respect.","Premature termination may come from a therapist's lack of cultural competence."],
["Nancy Boyd-Franklin's multisystems approach emphasizes:","Understanding the family within its larger environment and involving systems like school, church, and extended family",["Individual insight only","Matching clients with same-race therapists only","Short-term symptom relief"],"Zoom out to the whole system.","She encourages meetings outside the consultation room."],
["Asian Americans use mental health treatment at a very low rate, most likely because of:","Shame and stigma",["Lack of interest in therapy","High rates of private insurance","A preference for non-directive therapy"],"Problems are often expressed indirectly.","Language is also a barrier for nearly half of Asian Americans."],
["Asian Americans generally prefer a therapist who is:","Active and directive within a structured approach",["Non-directive","Passive and reflective","Highly informal"],"Structure and guidance.","Matching therapist ethnicity reduces dropout."],
["Native American healing traditions typically make no distinction between:","Mental and physical illness",["Family and community","Past and present","Healers and clients"],"Holistic.","Family therapy, especially with the extended family, and traditional healing practices are recommended."],
["Asian Americans/Pacific Islanders include 43 ethnic subgroups. What does this illustrate?","Tremendous within-group heterogeneity, so avoid stereotyping",["Cultural groups are essentially uniform","Between-group differences always exceed within-group differences","Etic principles apply universally"],"Lots of variety inside one label.","Very often within-group differences are greater than between-group differences."]
]}
];


var MUSH=[
{n:"Golden Chanterelle",l:"Cantharellus cibarius",f:"Chanterelles partner with tree roots underground, which is why they are so hard to farm and so treasured by foragers.",c:["I’m golden, like a sunrise on the forest floor.","Under my cap I have forking ridges instead of true gills.","Some people say I smell faintly of apricots.","I make friends with tree roots and love mossy woods.","Foragers dream of me sizzling in butter."]},
{n:"Fly Agaric",l:"Amanita muscaria",f:"Its red cap with white spots made it a storybook star, but it is toxic, so it is strictly for looking at.",c:["I wear a bright red hat covered in white freckles.","Fairy tales and video games adore me.","Gnome gardens are basically decorated with me.","I’m toxic, so look but never taste.","I pop up under birch and pine trees."]},
{n:"Lion’s Mane",l:"Hericium erinaceus",f:"Instead of a cap, it grows a shaggy white cascade of spines on hardwood trees, and cooks say it tastes a bit like crab.",c:["I don’t have a cap at all.","I look like a shaggy white waterfall.","My name comes from a big cat.","I grow on hardwood trees, especially oak.","Cooks compare my texture to crab or lobster."]},
{n:"Morel",l:"Morchella",f:"True morels are hollow inside and appear in spring, which is why foragers guard their secret spots. Always cook them.",c:["My cap looks like a honeycomb.","I’m hollow all the way through.","I pop up in spring, often after rain.","My head is shaped like a little cone.","Foragers never tell you where they found me."]},
{n:"Oyster Mushroom",l:"Pleurotus ostreatus",f:"Oyster mushrooms grow fast, and they can even trap tiny worms in the soil to snack on.",c:["I grow in shelf-like fans on logs.","My shape reminds people of a seafood.","I’m one of the easiest mushrooms to grow at home.","My gills run down toward the log I’m stuck to.","I can be pale gray, blue, or even pink."]},
{n:"Shiitake",l:"Lentinula edodes",f:"Growers have cultivated shiitake on logs for centuries, and it is a star of ramen and stir-fry.",c:["I’m a brown, dome-shaped classic.","People have grown me on logs for centuries.","Try me in ramen or stir-fry.","My cap often shows pale cracks and flecks.","I’m a staple in East Asian cooking."]},
{n:"Enoki",l:"Flammulina filiformis",f:"Wild enoki are short and orange-brown. The pale, long-stemmed kind in stores is grown in the dark.",c:["I grow in tidy little bunches.","My stems are as thin as noodles.","In stores, I’m usually pale and white.","You’ll find me floating in hot pot.","My tiny caps look like buttons."]},
{n:"Turkey Tail",l:"Trametes versicolor",f:"Named for the banded fan of a wild turkey’s tail, it is one of the most common mushrooms on fallen logs.",c:["I’m named after a bird.","My rings look like a rainbow of brown, blue, and cream.","I grow in overlapping rows on dead logs.","I’m thin and leathery, not squishy.","You’ll find me in nearly every woodland."]},
{n:"Amethyst Deceiver",l:"Laccaria amethystina",f:"It fades from deep purple to pale tan as it dries, which is how it earned the word deceiver.",c:["I’m purple like a gemstone.","As I dry out, I fade to a pale tan.","I’m small and easy to overlook.","My name says I might deceive you.","I like leaf litter in the woods."]},
{n:"Chicken of the Woods",l:"Laetiporus sulphureus",f:"Its bright shelves can grow into a cluster the size of a dinner platter. Cook it well and start with a small bite.",c:["I glow in orange and yellow.","I grow in layered shelves.","Some say I taste like chicken.","I like old oaks and other big trees.","I can get as big as a dinner platter."]},
{n:"Fairy Ring Champignon",l:"Marasmius oreades",f:"Fairy rings can keep growing outward for many years, and folklore says fairies dance inside them.",c:["I grow in perfect circles on lawns.","Folklore says fairies dance in my ring.","I’m small and tan with a little bell-shaped cap.","Old stories warn about stepping inside me.","I hide in plain sight in the grass."]}
];

hing else in a person.","Assuming an attractive person is also smart and kind."],"Scientists who form, test, and revise hypotheses":["Kelly’s view: people test hypotheses about the world and revise them.","You expect a friend to be late, notice she’s on time, and revise."],"Passive responders to reinforcement":["A behaviorist view of people, not Kelly’s active, future-oriented one.","A rat pressing a lever for food pellets."],"Driven by unconscious conflicts":["A psychodynamic view of people.","A slip of the tongue that reveals a hidden wish."],"Motivated mainly by consistency":["The view of consistency theories: people want mental harmony.","Changing an opinion to match something you did."],"Cognitive, affective, and behavioral":["Thoughts, feelings, and predispositions to act.","Believing recycling matters, feeling proud, and sorting the trash."],"Perceptual, motivational, and social":["Not the standard attitude components.","Loose categories someone might use to sort psychological processes."],"Conscious, preconscious, and unconscious":["Freud’s levels of awareness, not attitude parts.","A memory you can recall on request is preconscious."],"Central, peripheral, and situational":["Mixes persuasion routes with situation; not attitude parts.","Central and peripheral are routes in the elaboration likelihood model."],"Situational constraint":["Outside pressures that keep behavior from matching attitudes.","An owner holds a prejudice but serves the customer to avoid a scene."],"Cognitive dissonance":["Discomfort from inconsistent cognitions, resolved by changing attitudes.","Saying a dull task was fun for $1, then deciding it was fun."],"Reactance":["Resisting when your freedom feels threatened.","A teen does the opposite after a parent’s harsh order."],"Overjustification":["Extra rewards undermine existing intrinsic interest.","A child who loved reading stops once the sticker rewards end."],"Imbalanced":["A tense state: two positive and one negative element, or all negative.","Two friends who like each other disagree about a candidate."],"Balanced":["A harmonious state: all positive, or one positive and two negative.","Both friends adore the candidate."],"Congruent":["A word from congruity theory, not a balance-theory state.","Osgood’s congruity theory predicts which attitude will shift."],"Symmetrical":["A word tied to symmetry theory, not a balance-theory state.","Newcomb’s symmetry theory looks at relationship intensity."],"Symmetry theory (Newcomb)":["Balance theory plus the intensity of the relationship.","Best friends feel a political clash more than acquaintances do."],"Congruity theory (Osgood)":["Predicts which attitude changes: the one with less affinity.","Joe likes Beth more than the candidate, so he cools on the candidate."],"Self-verification theory":["People seek confirmation of their self-concept, even a negative one.","Someone with low self-esteem brushes off compliments."],"Reactance theory":["Resistance to persuasion when freedom feels threatened.","A hard-sell salesperson makes you refuse to buy."],"Change their attitudes to match their actions":["Dissonance is resolved by shifting the attitude to fit what you did.","After lying for $1, you come to believe the task was interesting."],"Change their actions to match their attitudes":["Behavior shifts to fit beliefs; real, but dissonance research stresses the reverse.","Someone who values health quits smoking."],"Ignore the inconsistency":["Dissonance theory says the tension pushes people to resolve it.","Someone unaware of the conflict wouldn’t feel dissonance at all."],"Seek others who disagree":["Not what dissonance predicts; people usually seek support.","A debate fan who deliberately tests views against critics."],"Participants paid $1":["Low pay means weak justification, more dissonance, more attitude change.","Someone paid a dollar to fib decides the task was interesting."],"Participants paid $20":["A big payment justifies the lie, so there is little dis  else if(a==="guide"){guideFocus=isNaN(i)?-1:i;setView("guide");if(guideFocus>=0)setTimeout(function(){var el=document.getElementById("gd"+guideFocus);if(el&&el.scrollIntoView)el.scrollIntoView({block:"center"})},40)}
 else if(a==="tog"){var w=t.closest(".ow"),op=w.classList.toggle("open");t.setAttribute("aria-expanded",op?"true":"false")}
 else if(a==="next"){G.i++;G.picked=null;G.hintOn=false;if(G.i>=G.qs.length){G.i=G.qs.length-1;finish()}else{render();window.scrollTo(0,0)}}
 else if(a==="retry"){startQuiz(G.kind,G.i0)}
 else if(a==="retake"){startRetake()}
 else if(a==="gonext"){cur={kind:"level",i:G.next};setView("intro")}
 else if(a==="reset"){
  if(!resetArmed){resetArmed=true;render()}
  else{try{localStorage.removeItem(KEY)}catch(err){}resetArmed=false;load();setView("home")}
 }
});
load();render();
