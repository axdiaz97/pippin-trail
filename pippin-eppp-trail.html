var EXQ=[["A culturally encapsulated therapist:",["is mindful and sensitive to race/culture.","disregards race/culture.","generalizes based on race/culture.","typically treats patients who share the same cultural background with the therapist."],2,"A culturally encapsulated therapist is someone who tends to make inappropriate generalizations about a particular group of clients based on race or culture.","Social and Multicultural","Think of someone who applies one cultural template to everyone.","Cultural encapsulation","Judging clients by the therapist's own cultural assumptions, playing down cultural differences, and overgeneralizing about groups."],["You are seeing a woman and her young son in family therapy. Your patient complains that her son suffers from repeated unexplained rashes, but admits that she has taken him to multiple doctors with no result. A collateral interview with her ex-husband who has joint physical custody reveals that when the boy is with him, he never suffers from rashes. This is a possible example of:",["Hypochondriasis.","Factitious Disorder by Proxy.","secondary gain.","Munchausen’s Syndrome."],1,"This vignette represents a possible case of Factitious Disorder by Proxy. The major feature of this disorder is the deliberate feigning of medical symptoms in a dependent under the care of the individual with the disorder (the mother, in this case). The goal of the patient is to assume the sick role, or in the case of Factitious Disorder by Proxy, to have their dependent assume the sick role.","Assessment and Diagnosis","Ask who is really \"sick\" here, and who gains from the sick role.","Factitious disorder imposed on another","Deliberately faking or causing illness in a dependent (like a child) to take on the sick role by proxy, without an outside reward such as money."],["You are involved in your company's assessment center, and are responsible for evaluating managerial level employees for promotion. You are also responsible for the quarterly performance appraisals of management level employees. A potential problem in this situation is:",["the halo effect.","a recency effect.","criterion contamination.","a central tendency bias."],2,"Criterion contamination occurs when the criterion is subjectively scored, and the rater has knowledge of the employees' predictor scores. In this case, you are aware of how employees performed in the assessment center (a predictor of future managerial success) and then rate them on the criterion (quarterly performance appraisals).","Assessment and Diagnosis","The same person is scoring both the predictor and the criterion.","Criterion contamination","When a rater's knowledge of predictor scores biases the criterion ratings, which artificially inflates the validity coefficient."],["The circadian clock is located in the hypothalamus and is responsible for sleep-wake patterns. The circadian clock is the:",["pineal gland","suprachiasmic nucleus","substantia nigra","reticular activating system (RAS)"],1,"It is the cluster of nerves called the suprachiasmic nucleus (SCN) that functions as the circadian clock. Sleep-wake patterns run on 24-hour cycles with two natural daily peak times for sleeping, at mid-day and at night. The SCN signals the pineal gland (also located in the hypothalamus) to produce melatonin, which in turn causes a drop in body temperature and sleepiness.","Biological Bases","It is named for its spot above the optic chiasm.","Suprachiasmatic nucleus","A cluster of hypothalamic cells that acts as the body's master clock for circadian rhythms such as sleeping and waking."],["On the MMPI-2, which validity scale(s) also serves as a moderator variable?",["Scale L.","Scale F.","Scale K.","Scales VRIN and TRIN."],2,"On the MMPI-2, the K scale measures guardedness or defensiveness. The K scale also serves as a moderator variable. Scores on the K scale are used to adjust for defensiveness, by adding points to a number of the clinical scales based on the K scale score.","Assessment and Diagnosis","A moderator changes how well another score predicts.","Scale K","The MMPI-2 defensiveness validity scale. Its K-correction is added to some clinical scales, so it moderates them."],["Semantic memory involves:",["the transfer from sensory memory to short term memory.","the transfer from short-term memory to long-term memory.","the meaning of the words.","the pronunciation of the words."],2,"Semantic memory is memory that has to do with the meaning of words.","Cognitive-Affective","Semantic points to the word \"meaning.\"","Semantic memory","Long-term memory for facts, concepts, and word meanings, as opposed to memory for personal episodes."],["According to the American Psychological Association's Ethical Principles of Psychologists and Code of Conduct, which of the following statements is most accurate regarding \"fee splitting\" between a psychologist and other professionals?",["Fee splitting is always unethical.","Fee splitting is permissible if it is based on services provided.","Fee splitting is permissible if it is fair and non-exploitative.","Fee splitting between psychologists based on referrals is unethical, but fee splitting with other professionals based on referrals may be acceptable."],1,"The APA Ethics Code explicitly prohibits fee splitting between professionals when it is based on referrals, e.g., a referral source receives 5% of a patient's on-going fees.","Ethics, Legal, Professional","Ask whether the money is tied to work actually done.","Fee splitting","Sharing a fee is acceptable only when the share matches the services each person actually provided, not a payment for referrals."],["Job satisfaction is negatively correlated with:",["education.","intelligence.","race.","turnover."],3,"Job satisfaction is negatively correlated with turnover. It tends to be positively correlated with education and intelligence, and tends to be higher among Caucasians than minorities.","Cognitive-Affective","Unhappy workers tend to do what?","Job satisfaction","Higher satisfaction goes with lower turnover and absenteeism, and only a modest link with performance."],["When deception is used in research:",["the researcher must inform subjects of the purpose of the study afterwards.","the researcher must obtain consent from subjects if they are at high risk.","it isn't possible to get consent beforehand, but subjects must be debriefed afterwards.","consent isn't required if subjects are at minimal risk."],0,"When deception is used in research, the deception must be explained to participants as early as is feasible, preferably at the conclusion of their participation, but no later than at the conclusion of the research. Keep in mind that even if deception is involved, consent from subjects must be obtained before they participate in the research.","Ethics, Legal, Professional","What do participants deserve to hear once it is over?","Debriefing","Explaining the true purpose of a study, and any deception used, to participants afterwards."],["The standard errors of the mean, measurement, and estimate express error in terms of:",["standard deviation.","sampling error.","systematic error.","the testing situation."],0,"All the standard error formulas express error in terms of standard deviation units. Sampling error applies to the standard error of the mean only. Systematic error does not apply to any of the standard error formulas.","Assessment and Diagnosis","Think of the spread of a normal curve.","Standard error","An estimate of how much scores vary because of error, expressed in standard deviation units."],["As you start to take this practice test you say to yourself, \"My heart is racing. I must be very nervous.\" This kind of thinking supports:",["the Cannon-Bard theory.","the James-Lange theory.","Schacter's Two-Factor theory.","General Adaptation Syndrome."],1,"According to the James-Lange theory, emotions result from perceiving bodily reactions or responses. In this case, you perceived your bodily reaction (heart racing) and concluded you must be very anxious. The Cannon-Bard theory proposes that emotions and bodily reactions occur simultaneously.","Cognitive-Affective","In this thought, which comes first: the body or the feeling?","James-Lange theory","Emotion results from perceiving your own bodily reactions (\"my heart is racing, so I must be afraid\")."],["The part of the brain not fully developed at birth is the:",["brainstem.","cerebellum.","cortex.","RAS."],2,"The cortex is the part of the brain that is not fully developed at birth. The brainstem, cerebellum, and RAS all involve functions that are necessary for life, and that are fully developed by the time of birth.","Biological Bases","Think of the wrinkled outer layer.","Cerebral cortex","The outer layer of the brain that handles thinking, language, and perception. It keeps developing after birth."],["The treatment of choice for OCD involves:",["systematic desensitization.","exposure with response prevention.","aversive counterconditioning.","supportive psychotherapy."],1,"The treatment of choice for OCD is flooding, also known as exposure with response prevention. For many years, systematic desensitization had been considered the treatment of choice for specific phobias, however, in recent research, exposure based treatment approaches (e.g., flooding) have been found to be more effective than systematic desensitization in the treatment of specific phobias.","Treatment and Prevention","Face the fear while blocking the ritual.","Exposure with response prevention","The treatment of choice for OCD: the person faces feared thoughts or objects and is stopped from doing the compulsive ritual."],["The thalamus is best described as:",["the master endocrine gland.","the seat of consciousness.","the relay station for all senses except olfaction.","the house of the somatosensory cortex."],2,"An all-time favorite on the licensing exam, the thalamus integrates and processes all sensory information except for olfaction (i.e., smell). The hypothalamus is considered the master endocrine gland. The parietal lobes house the somatosensory cortex.","Biological Bases","Picture a train station for incoming senses.","Thalamus","A relay center that routes sensory information to the cortex for every sense except smell."],["According to Marcia, adolescents can be in one of four possible identity states. Which of the following best describes foreclosure?",["Commitment and resolution of crisis.","Commitment and absence of crisis.","Crisis and absence of commitment.","Absence of both crisis and commitment."],1,"According to James Marcia, there are four possible identity statuses for adolescents. The adolescent in foreclosure commits himself or herself to a goal without exploring alternatives, thus there is commitment with an absence of crisis. In identity achievement, the person has struggled and explored several options and developed goals and values.","Growth and Lifespan","Marcia's identity states depend on crisis and commitment.","Identity foreclosure","Committing to an identity (often chosen by parents) without first exploring alternatives."],["The Zeigarnik effect refers to:",["the tendency of people to rely on the judgments of others when analyzing ambiguous stimuli.","the improvement in memory that occurs when imagery and visualization are used.","the tendency to remember uncompleted tasks better than completed ones.","the increase in obedience that occurs when the person in authority is significantly taller than the subordinate."],2,"The Zeigarnik effect refers to the phenomenon that people are more likely to remember uncompleted tasks than completed tasks. For example, examinees are more likely to remember test items of which they were uncertain (i.e., the task feels uncompleted).","Cognitive-Affective","Unfinished business stays on the mind.","Zeigarnik effect","People remember interrupted or unfinished tasks better than completed ones."],["The standard error of the estimate has:",["a direct relationship with the SD of the predictor and an indirect relationship with validity.","an indirect relationship with the SD of the predictor and a direct relationship with validity.","a direct relationship with the SD of the criterion and an indirect relationship with validity.","an indirect relationship with the SD of the criterion and a direct relationship with validity."],2,"The standard error of estimate is affected by two variables, the standard deviation of the criterion and criterion- related validity. Intuitively, when validity is high, there should be little error in prediction, and when validity is low, there should be a lot of error in prediction. This is an indirect relationship.","Assessment and Diagnosis","Two things push prediction error up or down.","Standard error of the estimate","The typical error when predicting the criterion from the predictor. It grows with more criterion variability and a weaker validity coefficient."],["A psychologist works in a small town, where she is the only psychologist. Her ex-boyfriend requests treatment from her, for a recently developed Specific Phobia. She has not been intimate with him for over ten years. If she consents to treat him, she:",["is acting ethically.","is acting unethically.","may be acting unethically, depending on the circumstances.","this issue is not covered in the ethical principles."],1,"The Ethics Code clearly states that psychologists never accept former sexual partners as therapy patients.","Ethics, Legal, Professional","Check what the Ethics Code says about former intimate partners.","Multiple relationships","Roles that could impair objectivity or risk exploitation, such as treating a former sexual partner, which is prohibited."],["From an operant learning perspective, it is best to manage children’s tantrums through:",["positive punishment.","negative reinforcement.","extinction.","shaping."],2,"Children often continue to tantrum because the attention they garner acts as reinforcement for them. A typical behavioral recommendation therefore is extinction, withholding the attention or other reinforcement. After extinction begins, an extinction burst (or response burst) typically occurs, during which the tantrums first intensify.","Cognitive-Affective","If the reward is attention, take it away.","Extinction","Removing the reinforcer that maintains a behavior so the behavior decreases."],["The part of the brain responsible for consolidation of long-term memory is:",["the medulla.","the hypothalamus.","the hippocampus.","the cerebellum."],2,"The hippocampus, within the temporal lobes, is involved in the consolidation of long-term memory.","Biological Bases","Think of a seahorse-shaped structure.","Hippocampus","A limbic structure crucial for turning new experiences into long-term memories."],["The halo effect can be controlled by all of the following except:",["training the raters.","utilizing forced choice.","utilizing relative methods.","utilizing BARS."],2,"The halo effect is the tendency to be influenced by only one attribute when giving an overall rating of an individual. Halo effects can be positive, such as giving a positive overall rating because an individual is attractive, or negative, such as giving a negative overall rating because the individual dresses poorly.","Assessment and Diagnosis","You are looking for the option that does NOT help.","Halo effect","Letting one strong impression, good or bad, color ratings of everything else about a person."],["Masters and Johnson's technique of sensate focus is based on:",["counterconditioning.","aversive counterconditioning.","positive reinforcement.","negative reinforcement."],0,"Sensate focus is a classical conditioning intervention that involves counterconditioning. In counterconditioning, a person learns a new response (e.g., pleasurable feelings) that is incompatible with a problematic response (e.g., performance anxiety).","Treatment and Prevention","Pair a calming response with the touch that used to cause anxiety.","Counterconditioning","Replacing an unwanted response (like anxiety) with an incompatible one (like relaxation) to the same stimulus."],["You have been treating a couple in therapy for the past two years. The couple has recently decided to divorce. According to research in this area, what is the most likely outcome?",["The woman will adapt better to the divorce than the man.","The man will adapt better to the divorce than the woman.","Both the man and the woman will adapt poorly.","Both the man and the woman will adapt well."],0,"The studies on the effects of divorce have shown that women find divorce less emotionally problematic than men. For example, suicide rates are up to six times higher in men who are separated or divorced compared with men who are in a relationship.","Growth and Lifespan","Recall the research on gender and adjustment after divorce.","Adjustment to divorce","According to the exam key, research finds women tend to adapt better to divorce than men do."],["Research on crowding has shown that:",["crowding tends to increase arousal for negative emotions but decrease arousal for positive emotions.","men are more affected by crowding than women.","the effects of crowding are independent of other variables such as noise and temperature.","the effects of crowding are not mediated by cultural variables."],1,"Men are generally more affected by crowding than women. Crowding tends to heighten overall arousal for both positive and negative emotions. Variables such as noise and temperature do influence the effects of crowding.","Social and Multicultural","Ask which group is more bothered by tight spaces.","Crowding","High density raises arousal and stress, and the effects tend to be stronger for men than for women."],["Which of the following designs is least likely to be threatened by history?",["AB.","ABAB.","Time series.","One group pre-post."],1,"History is defined as a coincidentally occurring event that is not part of treatment, which influences outcome. The threat of history is best taken care of by an ABAB design in which the person is first measured over time during a baseline phase (A), then treatment is implemented and the person is once again measured repeatedly during the intervention (B).","Research and Statistics","Look for the design that repeats baselines.","ABAB (reversal) design","A single-subject design that alternates baseline and treatment to show the treatment causes the change, which guards against history threats."],["During an intake evaluation, a client informs you that she has had sexual relations with her previous therapist. You happen to know this therapist personally. You should:",["discuss this with the therapist without revealing the client's name.","recommend that your client file an ethics complaint.","discuss available options with your client.","consider the diagnostic implications of her behavior."],2,"Discussing available options, which would probably include the option of filing an ethics charge, would be better than a direct recommendation that the person file the complaint. Discussing the sexual misconduct directly with the therapist would be a breach of confidentiality. Considering the diagnostic implications insufficiently addresses the ethical issues here.","Ethics, Legal, Professional","Give information and choices, not rescue.","Client's right to informed choice","Psychologists discuss options with the client, including reporting, rather than acting on their own."],["Wernicke's is to Broca's as:",["expression is to reception.","reception is to expression.","agnosia is to aphasia.","alexia is to agraphia."],1,"Wernicke's area is involved in receptive speech, while Broca's is involved in expressive speech. Agnosia is a failure to recognize sensory stimuli. Aphasia involves a problem with speech.","Biological Bases","Think comprehension versus production.","Wernicke's and Broca's areas","Wernicke's area supports understanding speech (receptive). Broca's area supports producing speech (expressive)."],["A Kappa coefficient of .95 suggests:",["a high degree of interrater reliability.","a high degree of test-retest reliability.","a high degree of criterion related validity.","a high degree of construct validity."],0,"The Kappa coefficient is a measure of interrater reliability. It is the degree of agreement between two or more raters when performance is subjectively scored. Reliability coefficients range from 0.0 to 1.0, and .95 suggests a very high degree of interrater reliability.","Assessment and Diagnosis","Kappa checks whether raters agree.","Kappa coefficient","A measure of interrater agreement that corrects for chance. A value of .95 is very high."],["Which of the following is an example of a protocol analysis?",["A supervisor and a supervisee carefully review the transcript of a psychotherapy session.","A person is told to verbalize his problem-solving process.","The human subjects committee reviews a proposed research protocol.","A researcher attempts to analyze which aspects of an intervention (i.e., treatment protocol) actually account for the treatment outcome."],1,"A protocol analysis involves subjects verbalizing their thought process as they perform a task. The goal is to better understand the person's cognitive process, especially concerning problem-solving, although it is understood that the process of verbalizing may actually alter the cognitive process.","Cognitive-Affective","Say it out loud while you solve it.","Protocol analysis","Studying thinking by having a person verbalize their thoughts while solving a problem."],["A murderer is found not guilty by reason of insanity. This means:",["the person was insane at the time of the murder.","the person has a history of insanity that predisposed him to this behavior.","the person is unable to defend himself during the court proceedings.","the person should be on medication."],0,"When someone is found not guilty by reason of insanity, the conclusion is that the person is not guilty because he was insane at the time the murder was committed. The inability to defend oneself in court proceedings is referred to as incompetency to stand trial.","Ethics, Legal, Professional","Insanity is judged at a particular moment.","Not guilty by reason of insanity","A legal finding that at the time of the crime the person could not understand its wrongfulness. It is a legal term, not a clinical one."],["The main reason for treatment failure with addictive behaviors is that these behaviors:",["are both operantly and classically reinforced.","are intermittently reinforced.","are reinforced on a variable ratio schedule.","are self-reinforcing."],3,"The high failure rate in treating addictive behaviors stems from the fact that many addictions are very powerfully reinforcing. They are considered to be self-reinforcing in that the person does not depend on any external reinforcement. Thus, addictive behaviors are not necessarily both operantly and classically conditioned.","Treatment and Prevention","Ask why it is so hard to stop.","Self-reinforcing behavior","Behavior that produces its own rewards (like relief or pleasure), so it resists extinction."],["The neurotransmitter involved with sleep and mood is:",["RAS.","acetylcholine.","dopamine.","serotonin."],3,"Serotonin is involved with both sleep and mood. Although the RAS or reticular activating system is involved in sleep, it is not a neurotransmitter but rather a diffuse set of cells in the medulla, pons, hypothalamus, and thalamus. Acetylcholine is involved in voluntary movement and memory.","Biological Bases","Think of mood and sleep together.","Serotonin","A neurotransmitter involved in mood, sleep, and appetite. Low levels are linked to depression."],["Partial complex seizures typically originate in:",["the frontal lobes.","the brain stem.","the temporal lobes.","the limbic system."],2,"The temporal lobes are most commonly the originating site of complex partial seizures. Keep in mind, though, that such seizures can originate in any cortical region. Complex partial seizures are frequently preceded by an aura, and usually include purposeless behavior, lip smacking, unintelligible speech, and impaired consciousness.","Biological Bases","Picture the region behind the temples.","Partial complex seizures","Seizures that usually begin in the temporal lobes and involve impaired awareness."],["In terms of parenting, which theorist would recommend the use of natural, logical consequences and a focus on the goals of misbehavior?",["Adler.","Minuchin.","Bowen.","Haley."],0,"Alfred Adler's Individual Psychology has been widely adapted and used in parenting programs. STEP (Systematic Training in Effective Parenting) helps parents structure family life so that children experience natural and logical consequences of both good behavior and misbehavior.","Cognitive-Affective","Think Alfred, not Sigmund.","Adlerian parenting","Adler recommends natural and logical consequences and understanding the goals of misbehavior (attention, power, revenge, inadequacy)."],["A T score of 70 would be equivalent to:",["a z score of +1.","the 70th percentile rank.","a raw score of about 70.","a score at about the 98th percentile rank."],3,"Recall that T scores, z scores and percentiles are all norm referenced scores that tell us about a person's relative standing or ranking in a group. These scores can also be compared to one another. The mean of T scores is 50, and the standard deviation is 10.","Research and Statistics","T scores have a mean of 50 and an SD of 10.","T score","A standard score with a mean of 50 and SD of 10. A T of 70 is two SDs above the mean, about the 98th percentile."],["Which of the following is not described by Piaget as typical of the preoperational child?",["Use of symbolic activity.","Ability to conserve.","Egocentrism.","Intuitive thinking."],1,"The preoperational child (ages 2 to 7) is egocentric, relies on intuitive thought rather than logical or deductive reasoning, and increasingly uses symbolic activity. The ability to conserve does not appear until the stage of concrete operations (age 7 to 11).","Growth and Lifespan","Find the thing preoperational kids cannot do yet.","Preoperational stage","Piaget's stage (about ages 2 to 7) with symbolic play, egocentrism, and intuitive thought, but no conservation."],["Whose theory would most likely explain \"behavioral contrast?\"",["Beck.","Pavlov.","Skinner.","Watson."],2,"The term behavioral contrast applies to the situation in which two behaviors are initially reinforced at equal levels and then one behavior stops being reinforced. What typically occurs is that the behavior that is no longer being reinforced decreases in frequency, while the behavior that continues to be reinforced increases in frequency.","Cognitive-Affective","Responding shifts when reward changes elsewhere.","Behavioral contrast","In operant conditioning, a change in reinforcement in one situation changes responding in a contrasting situation in the opposite direction."],["A high percentage of children with ADHD are responsive to psychostimulants. When a clinician is uncertain as to whether a child's diagnosis is ADHD, the reason the child should not be given a trial of psychostimulants for purposes of differential diagnosis is because:",["the child who does not have ADHD would likely experience some negative side effects of the medication (e.g., increased heart rate).","the child who does not have ADHD would likely experience a bit of a high.","the child who does not have ADHD would likely have an increased attention span and improved task performance.","the child who does not have ADHD would likely exhibit restlessness and distractibility."],2,"Even children without ADHD, when given psychostimulants, have improved attention span and concentration. Therefore, response to such medications would not be useful for differentiating children with ADHD from non-ADHD children.","Biological Bases","Would a child without ADHD also respond to a stimulant?","Psychostimulant response","Stimulants improve attention in most children, with or without ADHD, so a good response does not confirm the diagnosis."],["In an attempt to minimize discrimination against disadvantaged persons, employment testing has frequently included:",["multiple-aptitude batteries.","work sample tests.","biodata.","norm-referenced testing."],1,"To minimize discrimination, employment testing has moved from standardized tests in the direction of work sample tests. Work sample tests are excellent and fair predictors of work performance. Testing in general, such as multiple aptitude batteries and norm-referenced testing, tend to unfairly discriminate against disadvantaged individuals.","Assessment and Diagnosis","Which type of test is fairer to disadvantaged applicants?","Work sample tests","Tests where applicants perform real job tasks. They predict well and tend to show less adverse impact."],["When working with a client diagnosed HIV+, one should consider:",["one's personal safety and issues of risk.","the individual's health status and common sequelae of the disorder.","notifying partners of the infected individual.","the need or priority for individual treatment over group treatment."],1,"Important issues related to individuals diagnosed HIV+ include the individual's current health status as well as an understanding of common sequelae of the disorder. In most states psychologists are not allowed to inform partners of the infected individual. Also, group treatment, such as support groups, can be very beneficial to HIV+ individuals.","Treatment and Prevention","Health status shapes the therapy.","Working with HIV+ clients","Consider the person's current health and the typical medical and psychological effects of the illness, not just the diagnosis."],["Selling questions from the EPPP is:",["unethical but legal.","illegal but ethical.","ethical and legal.","unethical and illegal."],3,"Selling questions from the EPPP is both illegal and unethical. For example, it is illegal and unethical for an organization to steal items by having licensees deliberately memorize items and then recall the items immediately after the exam. Note that this behavior is different from examinees remembering a few items here and there, as well as remembering some of the general content areas asked about.","Ethics, Legal, Professional","Test security matters.","Test security","Psychologists must not release or sell protected test materials, which is both unethical and illegal."],["In attempting to reduce the incidence of HIV, it should be kept in mind that:",["knowledge of facts changes behavior.","it is harder to change the behavior of a large group than a small group.","informal norms can play a critical role in behavior.","negative reinforcement is the underlying principle in the acquisition of HIV."],2,"You might have been able to answer this question correctly just by relying on your own experience and common sense. Individual behavior is highly influenced by the informal norms of the group. For example, a teenager is profoundly influenced by the norms of his/her circle of friends.","Social and Multicultural","Peers can matter more than facts.","Informal norms","Unwritten group expectations strongly shape behavior, sometimes more than knowledge about risk."],["An individual presents to a hospital emergency room complaining of sudden onset of chest pains. If a medical diagnosis is ruled out, the most likely mental disorder is:",["Pain Disorder Associated With Psychological Factors.","Somatization Disorder.","Adjustment Disorder.","Panic Disorder."],3,"The symptoms of a Panic Attack can mimic those of a heart attack. The diagnosis of Somatization Disorder requires a history of multiple somatic complaints extending over a period of many years. Even a Pain Disorder subtyped acute (i.e., less than six months in duration) is marked by an on-going pain complaint and would not typically be diagnosed in the presence of one acute symptom.","Assessment and Diagnosis","Sudden chest pain with no medical cause.","Panic disorder","Recurrent, unexpected panic attacks with physical symptoms such as chest pain, a racing heart, and fear of losing control."],["A psychological intern leaves a case conference confused because the clinical director, the intern's supervisor, and another staff psychologist all disagree about how she should handle a case. The intern decides to follow the suggestion of the staff psychologist because they share the same theoretical orientation. Her decision is based on what type of power?",["Legitimate.","Expert.","Referent.","Coercive."],2,"There are five types of power that have been identified by psychologists: referent, legitimate, coercive, reward, and expert. In this example, the intern appears to like and identify with the staff psychologist whom she considers a role model. Her decision is therefore based on referent power.","Social and Multicultural","She likes and identifies with the staff psychologist.","Referent power","Influence that comes from liking and identifying with someone you see as a role model."],["Which of the following predominates in a state of relaxed wakefulness?",["Theta waves.","REM sleep.","Alpha waves.","Delta waves."],2,"Alpha waves occur during periods of relaxed wakefulness, and are predominant just before falling asleep. Theta waves occur in early stage 1 sleep. Delta waves are slow waves that occur in stages 3 and 4, the deepest, non-dreaming part of sleep.","Biological Bases","Think calm but awake.","Alpha waves","Brain waves typical of relaxed wakefulness, especially with eyes closed."],["Which of the following statements best summarizes the “Self-in-Relation” theory of the Stone Center at Wellesley College?",["Men and women develop a sense of self through relationships with others.","Women develop a sense of self through relationships with others.","Women have greater autonomy needs than men.","Women’s sense of self is more strongly affected by their relationships with women (e.g., mothers, sisters) than with men (e.g., fathers, brothers)."],1,"According to the “Self-in-Relation” theory, women develop their sense of self through relationships with others. This theory is in opposition to male-oriented theories that emphasize autonomy and separation as pathways of development. This theory does not concern itself with men’s development.","Growth and Lifespan","Relationships build the self, not separation.","Self-in-relation theory","A Stone Center theory that women develop identity through connection and relationships rather than separation."],["Response cost is an example of:",["negative reinforcement.","negative punishment.","positive punishment.","operant extinction."],1,"Since response cost involves taking something away, it is considered 'negative.' Since it is designed to decrease an unacceptable behavior, it is 'punishment.' Keep in mind that negative reinforcement involves removing something aversive to increase, not decrease behavior. Positive punishment involves applying something aversive (e.g. a slap, a shock) to decrease behavior.","Cognitive-Affective","You lose something after misbehaving.","Response cost (negative punishment)","Removing something valued after a behavior to decrease it, such as losing points or privileges."],["According to the American Psychological Association's Ethical Principles of Psychologists and Code of Conduct (2002), test data such as raw and scaled scores, may be released:",["to whomever the patient requests, with an appropriate release.","to the patient only, if the patient insists.","to professionals qualified to understand the data.","only when there is court order that overrides the ethical standard not to release raw data."],0,"According to the 2002 APA Ethics Code, test data should be released to the client, or to anyone designated by the client on an appropriate release. The psychologist may refuse to release the data only if he or she believes that doing so would cause \"substantial harm, or the misuse or misinterpretation of test data.\" There has never been an absolute prohibition against the release of raw data.","Ethics, Legal, Professional","Raw data need a proper release.","Release of test data","Test data may go to whomever the patient designates with an appropriate release, unless there is a risk of harm or misuse."],["An individual presents to a hospital emergency room with a flushed face, rambling speech, tachycardia, restlessness, and diuresis. The most likely diagnosis is:",["Diabetes.","Panic Disorder.","Opioid Intoxication.","Caffeine Intoxication."],3,"The symptoms described are classic symptoms of Caffeine Intoxication, which can result from consuming as little as 3 cups of coffee. Patients with Diabetes often complain of diuresis (excessive urination) but not the other symptoms. Individuals with Panic Disorder will frequently experience tachycardia, but not the other symptoms.","Assessment and Diagnosis","Flushed face, restless, lots of urination.","Caffeine intoxication","Restlessness, rambling speech, fast heartbeat, a flushed face, and frequent urination after a large amount of caffeine."],["Since the standard error of the measurement is significantly influenced by the reliability coefficient, the range of the standard error of the measurement is:",["-1 to +1.","0 to +1.","0 to SDx.","0 to SDy."],2,"The range of the standard error of measurement is always from 0 to the standard deviation of the test (SDx). The range of the validity coefficient is from -1 to +1. The range of the reliability coefficient is from 0 to +1.","Assessment and Diagnosis","Think of a range from 0 up to the test's spread.","Standard error of measurement","An estimate of how far an obtained score may differ from the true score. It ranges from 0 to the test's SD and shrinks as reliability rises."],["The Taylor-Russell tables are used to evaluate incremental validity, the benefit of using a test for improving selection decisions. The key variables that the tables take into account include base rate, selection ratio and:",["construct validity.","criterion-related validity.","test-retest reliability.","internal consistency reliability."],1,"There are three key variables that affect incremental validity: base rate, selection ratio, and criterion-related validity. Base rate is the rate of successful hiring without using a test. A moderate base rate optimizes incremental validity.","Assessment and Diagnosis","The tables use the base rate, selection ratio, and one validity type.","Taylor-Russell tables","Tables estimating how much a selection test improves hiring, using the base rate, selection ratio, and criterion-related validity."],["Compared to subjects who are not hypnotized, subjects in a hypnotic state:",["generally have enhanced memory recollection.","generally produce fewer false memories and more true memories.","generally produce more false memories with a high degree of confidence.","show equivalent rates of memory distortion and confabulation."],2,"Hypnosis appears to have no ability to enhance accurate memory recollection, but contributes to memory distortions in a variety of ways. Hypnotized subjects tend to produce more false memories, are more likely to confabulate (i.e., fill in memory gaps with made-up information), and tend to report their inaccurate memories with a high degree of confidence.","Cognitive-Affective","Confidence does not equal accuracy.","Hypnosis and memory","Hypnotized people tend to produce more false memories and feel very confident about them."],["Kohlberg proposed three major levels of moral development. Which of the following corresponds to level 2?",["Punishment-obedience orientation.","Conformity to please and gain approval.","Morality of contract and laws.","Morality of conscience."],1,"Kohlberg's three major levels of moral development are each divided into two substages. The first major level is Preconventional Morality with an emphasis on compliance with rules to avoid punishment and get rewards. The two substages are Punishment-Obedience and Instrumental Hedonism.","Growth and Lifespan","Level 2 is about pleasing others and following rules.","Conventional morality","Kohlberg's level 2, where right and wrong is based on gaining approval and following social rules."],["Preadolescent sibling relationships are characterized by:",["competitiveness/hostility.","aggressiveness/passivity.","loyalty/friendship.","conflict/friendship."],3,"Research into sibling relationships in preadolescence indicates that these relationships are characterized by periods of both conflict and friendship. Conflict is theorized to be the result of less emotional inhibition with one’s sibling, which leads to more overt presentations of hostility.","Growth and Lifespan","Think both closeness and clashing.","Sibling relationships","Preadolescent siblings typically show a mix of conflict and friendship."],["Dopamine is implicated in which of the following?",["Depression.","Schizophrenia.","Anxiety.","Substance Abuse."],1,"The 'dopamine hypothesis' posits that an excess of dopamine results in Schizophrenia. The evidence for this hypothesis is mixed. The neurotransmitters implicated in depression are norepinephrine and serotonin.","Biological Bases","A neurotransmitter tied to psychosis.","Dopamine","A neurotransmitter involved in movement, reward, and schizophrenia, where activity is thought to be excessive."],["According to Sue and Sue's racial/cultural identity development model, the culturally different person is most likely to be critical of dominant culture during the stage of:",["resistance and immersion.","dissonance.","conformity.","introspection."],0,"According to Sue & Sue's model of racial/cultural identity development, in the first stage, conformity, the minority person unequivocally prefers the dominant culture's values over his or her own. During the second stage, dissonance, the minority person becomes increasingly aware that not all values of dominant culture are beneficial, and certain aspects of minority culture begin to have appeal.","Social and Multicultural","The critical stage comes after conformity and dissonance.","Resistance and immersion","The Sue and Sue stage where the person endorses minority views and rejects dominant culture."],["The prevalence ratio of Autistic Disorder is about:",["equal in males and females.","twice as common in females.","four to five times more common in males.","six to nine times more common in males."],2,"Autistic Disorder is more common in males than in females. The DSM-IV reports it as 4 to 5 times more common in males. Disorders that are equally common in males and females are Schizophrenia, Bipolar I Disorder, and Obsessive-Compulsive Disorder.","Assessment and Diagnosis","Boys outnumber girls several times over.","Autistic disorder prevalence","About four to five times more common in males than in females."],["In the American Psychological Association's Ethical Principles of Psychologists and Code of Conduct (2002), the relationship between the standards and general principles is:",["the first are aspirational, the second enforceable.","the first are enforceable, the second aspirational.","both are enforceable.","both are aspirational, while laws are enforceable."],1,"In the American Psychological Association's Ethical Principles of Psychologists and Code of Conduct (2002), there are five general principles, which are considered aspirational, and ten standards, which are considered to be the enforceable aspect of the Ethics Code.","Ethics, Legal, Professional","One set can lead to discipline, the other is inspirational.","Ethics Code structure","The ethical standards are enforceable rules. The general principles are aspirational goals."],["At what age would separation from the mother be most difficult for a child?",["0 - 4 months.","5 - 10 months.","10 - 16 months.","16 - 24 months."],2,"According to the psychoanalytic developmental theorist Margaret Mahler, the first month constitutes an autistic phase (a speculation which has not, incidentally, been supported by further research), and months 2-4 constitute the symbiotic phase.","Growth and Lifespan","Peak separation anxiety comes in the first year and a bit.","Separation anxiety","Distress at separation from a caregiver that typically peaks around 10 to 16 months."],["In psychotherapy outcome research, the factors that appear most responsible for lack of improvement are:",["therapist factors.","therapist-client interactional factors.","client factors.","type of treatment factors."],2,"Psychotherapy outcome is most influenced by client factors, e.g., diagnoses, motivation for change, distress, etc.","Treatment and Prevention","Think about who shows up to therapy.","Common factors in outcome research","Client factors, such as motivation and severity, account for the most variance in lack of improvement."],["Which of the following terms refers to a disease of unknown origin?",["iatrogenic.","idiopathic.","idiosyncratic.","nocebic."],1,"When the cause of a disease is unknown, it is referred to as idiopathic. Iatrogenic is a very important medical term that refers to illness or complications, especially infections, that are caused in the course of receiving medical treatment (e.g., a patient contracts TB while in the hospital). Idiosyncratic is a non-technical term for unusual, eccentric, or unique responses.","Biological Bases","The Greek root means \"one's own.\"","Idiopathic","Describes a disease with an unknown origin or cause."],["A student acts in a disruptive manner and only stops when the teacher yells at her. The teacher's behavior of yelling is under the control of:",["positive reinforcement.","negative reinforcement.","positive punishment.","negative punishment."],1,"This question may be a bit tricky because it sounds like it's focusing on the student's behavior, but it's actually asking about the teacher's behavior. The target behavior here is the teacher's yelling. One must always look at whether something is added (positive) or removed (negative) after the target behavior is emitted.","Cognitive-Affective","The teacher stops yelling when the student stops.","Negative reinforcement","Removing an aversive stimulus after a behavior to increase that behavior. Here the yelling stops, so the teacher keeps yelling."],["African American families characteristically:",["are matriarchal.","evidence role flexibility.","are small and isolated.","have as many economic opportunities as their Caucasian counterparts."],1,"African American families frequently demonstrate role flexibility. Families tend to be egalitarian and rely on extended family for support. It is a myth that African American families tend to be matriarchal.","Social and Multicultural","Think about roles in the family.","African American family structure","Contemporary descriptions emphasize flexible roles rather than a fixed matriarchal structure."],["Research on the impact of early maturation in adolescence has found that:",["boys tend to benefit more.","girls tend to benefit more.","both boys and girls benefit more when compared to late-maturing peers.","both boys and girls benefit less when compared to late-maturing peers."],0,"Overall, girls who mature earlier tend to be at a disadvantage compared to late- maturing peers, while boys who mature earlier tend to have an advantage over late-maturing peers.","Growth and Lifespan","Consider boys versus girls.","Early maturation","Early-maturing boys tend to have social advantages, while early-maturing girls tend to face more difficulties."],["The concordance rate for identical twins for Bipolar I Disorder is about:",["10%.","25%.","50%.","75%."],3,"The concordance rate for identical twins with Bipolar Disorder ranges from about 75% - 80%. Keep in mind that Bipolar I Disorder is among the most heavily genetically loaded disorders.","Assessment and Diagnosis","Twin concordance for bipolar disorder is high.","Twin concordance for bipolar I","About 75% concordance in identical twins, showing a strong genetic influence."],["For each A score, the variability of B scores is equal to the total variability of B scores. You can conclude that:",["an error has been made; this is quite unlikely to occur.","there is a moderate positive correlation between A and B.","there is a moderate negative correlation between A and B.","there is no correlation between A and B."],3,"In this correlation, for any A value, you end up with all possible B values (i.e., total variability of B scores). The graph would look like one giant scatterplot, with dots all over the place. Knowing A tells you nothing about what B could be, since B could be anything.","Research and Statistics","Knowing A tells you nothing about B.","Zero correlation","When knowing one variable does not reduce uncertainty about the other, there is no correlation."],["You are a psychologist who has been licensed for 10 years, and are employed in a hospital setting. The hospital's associate director has just received his doctoral degree in psychology, and requests that you provide him with supervision for some of his post-doctoral hours required for licensure. You should:",["consent to supervise him if he has no involvement with or responsibility for evaluating your performance.","consent to supervise him if he has no involvement with or responsibility for evaluating your performance, and you do not interact with him in any other capacity.","refuse to supervise him because this arrangement would conflict with organizational structure and hierarchy.","refuse to supervise him because of the inherent conflict and potential problems that could arise."],3,"According to the Ethics Code a psychologist should refrain from entering into a professional relationship (e.g., providing supervision) if the relationship might impair the psychologist's objectivity, or harm or exploit the other party. Additionally, a psychologist should not take on professional obligations when the pre-existing relationship would create a risk of harm.","Ethics, Legal, Professional","Consider the risk of a dual relationship.","Multiple relationships","Avoid professional roles that could impair objectivity or create conflicts, such as supervising someone in a problematic role."],["A child was classically conditioned to be afraid of a white rat. The child now seems to be fearful of white rabbits as well. This is an example of:",["response generalization.","mediated generalization.","avoidance behavior.","Skinnerian conditioning."],1,"Mediated generalization is another name for stimulus generalization. In this example, the white rat is a conditioned stimulus. The child has generalized the response of fear to other similar stimuli such as white rabbits.","Cognitive-Affective","The fear spread to a similar object.","Stimulus generalization (mediated)","A conditioned response spreads to similar stimuli. Mediated generalization occurs through a shared meaning or label."],["The defense mechanism that is thought to underlie all others is:",["repression.","denial.","projection.","reaction formation."],0,"This is one of those concepts that you just need to know. Repression, or making the conscious unconscious, is a fundamental aspect of all the defense mechanisms. All defense mechanisms have the purpose of keeping certain mental contents out of conscious awareness.","Cognitive-Affective","The first defense, on which others depend.","Repression","The defense mechanism that pushes unacceptable thoughts and impulses out of awareness. Freud saw it as the foundation of the others."],["To optimize the teaching of inner city children by inner city teachers you should:",["offer training on the impact of socioeconomics on learning.","allow teachers flexibility in designing the curriculum.","focus on increasing teacher's expectancies of children's performance.","focus on giving teachers a realistic sense of likely performance."],2,"When teachers have a high expectation of students' performance, student performance is maximized. Note that you might have guessed this question correctly by applying your knowledge of self-fulfilling prophecies.","Social and Multicultural","Think about self-fulfilling prophecies.","Teacher expectancy","Teachers' expectations shape students' performance, so raising expectations tends to improve results."],["A child refers to a neighbor’s dog by the same name she refers to her family dog (e.g., “Scottie”). This behavior is an example of:",["underextension.","overextension.","holophrasic speech.","telegraphic speech."],1,"Early speech (about 18 months of age) is characterized by both underextension and overextension of word meanings. Overextension occurs when a word is used too broadly. In this example, the child calls the neighbor’s dog by the same name as her own.","Growth and Lifespan","A word stretched to cover too much.","Overextension","Using a word for a broader set of objects than it properly covers, such as calling every dog \"Scottie.\""],["A therapist asks the members of a psychotherapy group to refrain from asking questions of others and to speak only about themselves. The group members comply with this request. This scenario is an example of:",["a group norm.","a group task.","a group expectation.","social facilitation."],0,"A group norm is a standard of behavior that group members follow. It can be formally initiated by a leader or it can informally emerge from the members’ behavior. A group task is a specific assignment given to a group.","Social and Multicultural","Unwritten rules of a group.","Group norm","A shared expectation about how members should behave in a group."],["The presence of incoherence and loose associations is most suggestive of:",["Schizophrenia, Catatonic Type.","Schizophrenia, Disorganized Type.","Schizophrenia, Paranoid Type.","Delusional Disorder."],1,"Incoherence and loose associations are typical of Schizophrenia, Disorganized Type, while catatonic stupor, rigidity, or unusual posturing are typical of Schizophrenia, Catatonic Type. Schizophrenia, Paranoid Type, is characterized by systematized delusions or frequent auditory hallucinations related to a single theme.","Assessment and Diagnosis","Speech that jumps track.","Disorganized schizophrenia","Marked by disorganized speech such as loose associations and incoherence, and flat or inappropriate affect."],["The most frequently filed ethics charges relate to:",["breach of confidentiality.","sexual misconduct.","practicing outside of one's area of competence.","insensitivity to cultural issues."],1,"Of all ethics charges filed against psychologists, sexual misconduct is the most frequent one.","Ethics, Legal, Professional","What do boards see most often?","Ethics complaints","Sexual misconduct is the most frequent basis for ethics charges."],["If using a selection test results in 40% of the African American applicants being hired and 45% of the white applicants being hired, you can conclude:",["adverse impact has occurred.","adverse impact has occurred and the test has differential validity.","the test is unfair.","the test may or may not have differential validity."],3,"Adverse impact has occurred when the percentage of minorities hired is less than 4/5ths of the percentage of non- minorities hired. The easiest way to calculate this is to multiply the hiring rate for non-minorities by .8. In this case, the percentage of the non-minorities hired is 45%.","Assessment and Diagnosis","Selection rates alone do not prove validity differences.","Differential validity","Whether a test predicts equally well across groups. Different hiring rates do not by themselves show it."],["Which of the following scenarios will tend to increase the standard error of the mean?",["Increasing the SD of the population and decreasing sample size.","Decreasing the SD of the population and increasing sample size.","Increasing both the SD of the population and sample size.","Decreasing both the SD of the population and sample size."],0,"The standard error of the mean has a direct relationship with the SD of the population and an indirect relationship with sample size. The standard error of the mean increases when the SD of the population is increased and sample size is reduced.","Research and Statistics","More noise in the population and fewer people.","Standard error of the mean","SD of the population divided by the square root of N, so a larger SD or a smaller sample raises it."],["When should management reward group performance rather than individual performance?",["To reduce social loafing.","On a task that is high in interdependence.","On a task that is low in interdependence.","On a task that is conjunctive."],1,"In an interdependent task, group members need to work together in order to succeed, therefore rewarding group performance is most sensible. In a task that is low in interdependence, individual performance is more important; therefore individual rewards would be more useful. Social loafing occurs when people in a group work less hard than they would if they were being evaluated individually.","Social and Multicultural","Reward the group when the work is intertwined.","Interdependence","When tasks need coordination, group rewards support cooperation better than individual rewards."],["Neurotransmitter imbalances have been identified in people with eating disorders. Most notably, persons with eating disorders frequently have a deficiency of:",["acetylcholine.","GABA.","dopamine.","serotonin."],3,"Serotonin and norepinephrine are significantly involved in regulation of appetite, as well as mood and sleep. Persons with eating disorders as well as depressive disorders commonly have low levels of these neurotransmitters. This may also partly explain the link that frequently exists between eating disorders and depressive illness.","Biological Bases","Think of the neurotransmitter for mood and appetite.","Serotonin","A neurotransmitter involved in mood, sleep, and appetite. Low levels are linked to eating disorders."],["On simple and familiar tasks, the presence of others tends to:",["improve performance.","compromise performance.","have no significant effect on performance as compared with when others are not present.","either improve or compromise performance depending on whether others are critical or complimentary."],0,"The presence of others on simple and familiar tasks (e.g., running a marathon) tends to enhance performance. This is termed social facilitation. When the task is novel or complex, social inhibition occurs, and task performance is worsened in the presence of others.","Social and Multicultural","Easy task, audience present.","Social facilitation","Others' presence improves performance on simple or well-learned tasks."],["Parkinson's Disease is due to loss of cells in the:",["substantia nigra.","basal ganglia.","caudate nucleus.","hippocampus."],0,"The basal ganglia includes, among many other structures, the substantia nigra and the caudate nucleus. Thus, although Parkinson's Disease is a result of damage to the basal ganglia, it is more specific and accurate to state that it results from a loss of cells in the substantia nigra (as well as a decrease in dopamine).","Biological Bases","Named for its dark pigment.","Substantia nigra","A midbrain structure that produces dopamine. Loss of its cells causes Parkinson's disease."],["The highest rates of responding during acquisition of a new behavior are associated with which of the following schedules of reinforcement?",["Variable interval.","Variable ratio.","Continuous.","Contiguous."],2,"During acquisition of a new behavior, the highest rates of responding are associated with a schedule of continuous reinforcement, i.e., when behavior is reinforced every single time it occurs.","Treatment and Prevention","New behavior is learned fastest with rewards every time.","Continuous reinforcement","Reinforcing every correct response, which speeds acquisition but is quickly extinguished."],["In order to extinguish a classically conditioned response, one should omit the:",["conditioned stimulus.","unconditioned stimulus.","conditioned response.","unconditioned response."],1,"Classically conditioned responses are based on pairing initially neutral stimuli with unconditioned stimuli, until the neutral stimulus eventually elicits a conditioned response. To extinguish this conditioned response, one would simply continue to present the conditioned stimulus without the unconditioned stimulus until the pairing is slowly erased.","Treatment and Prevention","The stimulus that used to pair with the CS.","Extinction of a classical response","Presenting the conditioned stimulus repeatedly without the unconditioned stimulus."],["In her third session, a client tells you that she is also seeing a sex therapist. Recently, this sex therapist had the client take off her top and then massaged the client's breasts in a demonstration of sensate focus techniques. The best course of action would be to:",["recommend that she terminate therapy and file an ethics charge.","discuss your ethical concerns with the therapist.","explore the impact this is having on her, and based on her reactions (e.g., her feelings about whether it's therapeutic or not) decide on your course of action.","discuss her dynamics."],0,"The behavior of the sex therapist is unethical. This is a clear case of a therapist exploiting the client in the guise of doing therapy. Of the responses here, the best one would be to recommend that your client terminate therapy and file an ethics charge.","Ethics, Legal, Professional","Think about the client's protection and her options.","Therapist exploitation","A therapist exploiting a client under the guise of therapy is unethical, and the client can be encouraged to end treatment and file a charge."],["In Brown vs. Board of Education (1954) the Supreme Court ruled that racial segregation of children in public schools was a violation of the Fourteenth Amendment. Testimony was presented based on innovative psychological tests using dolls to identify harm inflicted on the plaintiff children due to segregation. Who conducted these tests?",["Thurgood Marshall.","John Davis.","Kenneth Clark.","Linda Brown."],2,"In Brown vs. Board of Education, the NAACP took up the case on behalf of Linda Brown, a black girl attending fifth grade in the public schools in Topeka, Kansas, who was denied admission into a white elementary school. Thurgood Marshall was the NAACP counsel, and John Davis argued on behalf of the defendant school officials.","Assessment and Diagnosis","The famous doll studies.","Kenneth Clark","Psychologist whose doll studies with Mamie Clark were cited in Brown vs. Board of Education."],["While playing baseball, you are struck in the head by a fly ball. You are unable to remember the plays leading up to the time you were struck. Most likely you are suffering from:",["proactive inhibition.","retroactive inhibition.","anterograde amnesia.","retrograde amnesia."],3,"For the licensing exam, it is important to be very clear about the difference between the two kinds of amnesia. Retrograde amnesia is loss of memory for events occurring before the trauma (retro = backward); anterograde amnesia is loss of memory for events occurring after the trauma (don't think about the prefix 'ante' because it gets very confusing!).","Cognitive-Affective","Memory loss for events before an injury.","Retrograde amnesia","Loss of memories formed before a brain injury."],["A family you are treating mentions that the five-year-old daughter has headaches. You notice that there are some bruises on her forehead as well as on her arms, and have some concern about possible child abuse. You wish to contact the child's physician. In order to do so:",["you should get written consent from the parents.","you should get verbal consent from the parents.","you do not need to get consent from the parents.","you need consent from the parents and child."],0,"In general, the law mandates that you breach confidentiality to report suspected abuse to child protective services. Such reports are breaches of confidentiality because they are typically made without parental consent. In this situation, you would need written consent from the parents in order to contact the child's physician.","Ethics, Legal, Professional","Ask who needs to agree before you contact the child's doctor.","Consent versus mandated reporting","Reporting suspected abuse can be done without parental consent, but contacting the child's physician requires the parents' written consent."],["Increasing test length:",["will affect only reliability.","will affect reliability more than validity.","will have an equal effect on reliability and validity.","will affect neither reliability, nor validity."],1,"Increasing test length will have a direct impact on reliability since it is one of the key factors that affect reliability. Everything else being equal, the more items a test has, the more reliable the test is. Since reliability, in turn, puts a ceiling on validity, increasing test length will also affect validity.","Assessment and Diagnosis","Longer tests are more consistent.","Test length","Adding similar items increases reliability, and validity is affected less."],["You and a colleague both applied for a position and were turned down. You attribute your colleague's failure to his lack of enthusiasm during the interview. This can best be explained by:",["the self-serving bias.","the fundamental attribution error.","Weiner's theory.","self-perception theory."],1,"In this question an attribution is made about a colleague's failure. According to the fundamental attribution bias, people explain the failures of others by attributing the failure to internal causes. The self-serving bias relates to the different attributions people make when they themselves succeed or fail.","Social and Multicultural","Blaming his personality, not the situation.","Fundamental attribution error","Explaining others' behavior by disposition while underrating the situation."],["A child is diagnosed with Type I Diabetes. As an adolescent, he is most likely to:",["exhibit increased self-reliance and compliance with the prescribed diabetic regimen.","exhibit increased self-reliance and decreased compliance with the prescribed diabetic regimen.","show increased concern about issues of mortality.","rely increasingly on his parents for support and guidance."],1,"Adolescents have gained more of the skills and maturity necessary for increased self-reliance in their medical regime, and also usually experience a strong drive to be as independent as possible. Similarly, just as adolescents tend to be decreasingly compliant in general, they become decreasingly compliant with their diabetic regime.","Growth and Lifespan","Managing a chronic condition takes work.","Type I diabetes in adolescence","Adolescents may show growing independence with poorer compliance with the medical regimen."],["As a psychologist, you begin a sexual relationship with one of your former clients. This behavior:",["is unethical and illegal.","is unethical.","is ethical.","may be ethical."],3,"The Ethics Code states it may be ethical to engage in sexual intimacies with a former therapy patient provided at least two years have passed since the end of therapy and the psychologist can demonstrate there has been no exploitation in light of seven factors (e.g., nature and duration of therapy, patient's current mental status, etc.).","Ethics, Legal, Professional","Check the time limit and the seven-factor test in the Ethics Code.","Sexual intimacy with former clients","Allowed only after at least two years, and only if you can show there was no exploitation. It is otherwise prohibited."],["The Eriksonian stage corresponding to the second year of life is:",["autonomy versus shame.","trust versus mistrust.","initiative versus guilt.","industry versus inferiority."],0,"This is another one of those concepts you just need to know. The Eriksonian stage corresponding to the second year of life (Freud's anal stage) is autonomy versus shame. Trust versus mistrust corresponds to the first year of life (Freud's oral stage).","Growth and Lifespan","Erikson's second stage is about toilet training and independence.","Autonomy versus shame and doubt","Erikson's stage for ages 1 to 3, where children develop a sense of independence."],["When treating Asian American clients, one should consider that they typically prefer:",["an active, directive approach.","a non-directive approach.","a focus on separation-individuation issues.","an emotional-expressive approach."],0,"It is a frequently cited finding that Asian Americans prefer a logical, structured, and directive approach in therapy. Asian Americans, especially if somewhat unacculturated, are likely to seek the services of a psychologist for more practical types of problems, such as vocational selection or evaluation of aptitude rather than for emotional problems.","Social and Multicultural","A structured, logical style.","Asian American therapy preferences","Asian American clients typically prefer a structured, active, and directive approach."],["Beck emphasizes:",["automatic thinking and logical errors.","irrational beliefs.","positive self-statements.","positive and negative reinforcement."],0,"Although there are similarities in terminology, you need to know which terms apply to which cognitive theory. Beck is the founder of Cognitive Therapy. He is known for \"automatic thinking\" and \"logical errors.\" His contemporary Ellis, the founder of Rational-Emotive Therapy, coined the term \"irrational beliefs\".","Treatment and Prevention","Beck targets thoughts, not just feelings.","Cognitive therapy (Beck)","Focuses on automatic thoughts and cognitive distortions, or logical errors, that drive emotions."],["The best strategy for decreasing tension between opposing factions is to:",["provide lectures and discussions about the need for cooperation.","have both factions participate in a social function together.","have both factions work together to achieve a goal neither can accomplish alone.","give both factions sufficient space."],2,"This question is based on Sherif's findings in the Robber's Cave study. The only approach that was found to be successful in decreasing intergroup hostility (i.e., hostility between two opposing factions) was the introduction of a superordinate goal, a goal that could only be achieved with the cooperation of both factions.","Social and Multicultural","Give both groups a shared challenge.","Superordinate goals","Goals that both groups want and can only reach together, which reduce intergroup conflict."],["When the IQs of adoptive children are correlated with the IQs of their biological mothers and adoptive mothers:",["the correlation with biological mothers is stronger.","the correlation with adoptive mothers is stronger.","the correlations do not differ from zero.","the correlations with both adoptive and biological mothers are strongest when using a sample of brighter than average adoptees."],0,"Research has shown the correlations of IQ are highest with biological parents as opposed to adoptive parents. Correlations are always weaker when ranges are restricted.","Growth and Lifespan","Genes versus environment.","Adoption studies","Adopted children's IQs correlate more with their biological mothers, suggesting a genetic influence."],["Raven's Progressive Matrices is thought to be one of the best tests of:",["Spearman's \"g\" factor.","crystallized intelligence.","visuo-spatial abilities.","non-verbal memory."],0,"Raven's Progressive Matrices consists of a series of abstract patterns with one piece missing. The test requires the person to pick out the missing piece using a multiple choice format. Raven's Progressive Matrices is thought to be one of the best non-verbal tests of intelligence.","Assessment and Diagnosis","A test with abstract patterns.","General intelligence (g)","Spearman's general factor underlying all cognitive tasks, best tapped by Raven's abstract reasoning test."],["An attractive 40-year-old man selects as his partner a fairly unattractive 20-year-old woman. What could explain this man's choice?",["Matching theory.","Similarity hypothesis.","Long-distance relationship.","Reciprocity hypothesis."],3,"The most likely explanation here is the reciprocity hypothesis, which states that people tend to like others who like them. The matching hypothesis proposes that people of approximately equal physical attractiveness are likely to select each other. The similarity hypothesis posits that people similar to each other (e.g., similar in age, race, or religion) tend to form intimate relationships.","Social and Multicultural","One likes the other back.","Reciprocity hypothesis","People tend to like those who like them."],["In comparing the relationship between satisfaction and performance, and satisfaction and length of employment:",["both correlations are weak and positive.","both correlations are moderate and positive.","the first correlation is weak and positive, the second moderate and negative.","the first correlation is weak and positive, the second moderate and positive."],3,"Keep in mind that there is a weak positive correlation (about .15) between satisfaction and performance, and a moderate negative correlation between satisfaction and turnover. Because the second part of the question is asking about the correlation between satisfaction and length of employment (the reverse of turnover) this correlation would be moderate, but positive.","Cognitive-Affective","One link is weak, one is moderate.","Satisfaction correlations","Job satisfaction correlates weakly with performance and more moderately with length of employment."],["Self-Instruction is most useful with individuals with:",["depression.","phobias.","hyperactivity.","Borderline Personality Disorder."],2,"Self-Instructional Therapy, developed by Meichenbaum, is a form of cognitive-behavioral therapy that combines modeling and graduated practice with elements of Rational-Emotive Theory, to help children or adults that have problems with task completion. This approach has been widely implemented and is especially useful with hyperactive and impulsive children.","Treatment and Prevention","Talking to yourself to slow down.","Self-instruction training","Meichenbaum's technique teaching people to use self-talk to guide behavior, useful with impulsive or hyperactive children."],["Obsessive-Compulsive Disorder (OCD) usually begins in adolescence or early adulthood, and overall, is equally common in males and females. Which of the following statements best describes the incidence of OCD in children and adolescents?",["OCD occurs more commonly in males.","OCD occurs more commonly in females.","OCD is equally common in males and females.","There has not been sufficient research to date to ascertain the incidence of OCD in children and adolescents."],0,"Obsessive-Compulsive Disorder (OCD) has a lifetime prevalence rate of about 2.5%. While overall, males and females are affected equally, males have a modal age of onset that is earlier than females. For males the modal age of onset is between ages 6 and 15 years; for females the modal age of onset is between ages 20 and 29 years.","Assessment and Diagnosis","Look at when it starts, not just how common it is.","OCD onset by sex","Overall, males and females are affected about equally, but males tend to have an earlier age of onset (childhood to mid-teens) than females (twenties)."],["After conducting a two-way ANOVA, you determine significant differences have been found. You are most likely to conclude:",["there are main effects and there may or may not be interaction effects.","there are interaction effects and there may or may not be main effects.","there can be any combination of main effects and interactions.","there are probably neither main effects nor interaction effects because the results may be due to chance."],2,"When you conduct a two-way ANOVA, you calculate three F ratios, and therefore there are three possibilities for significance. There are two possible main effects (for Variable A and Variable B), and a possible interaction effect. The important point is that when you get significance in a two-way ANOVA, it can be any combination of main effects and interactions.","Research and Statistics","A significant result does not tell you which effect caused it.","Two-way ANOVA","Tests two independent variables at once, giving two main effects and one interaction, in any combination."],["A woman goes to a psychic who tells her that she is a very sensitive person. The woman responds enthusiastically, “you’ve got me pegged!” This interaction is an example of the:",["Hawthorne effect.","Rosenthal effect.","Barnum effect.","Law of effect."],2,"The Barnum effect occurs when someone finds personal meaning in a statement that could apply to anyone. In this case, the psychic capitalized on this effect in order to convince her client that she has psychic powers. The Hawthorne effect is associated with a change in behavior that results from being observed.","Social and Multicultural","Vague statements feel personal to everyone.","Barnum effect","Accepting general, vague personality descriptions as uniquely true of you."],["Radiation treatment for children with tumors in the cerebellum (cerebellar astrocytomas) may result in:",["learning problems or disabilities.","impaired visuospatial abilities.","memory problems.","apraxias."],0,"Among childhood brain tumors, 15-25% are cerebellar astrocytomas, which can be either benign or malignant. Chemotherapy is usually the preferred mode of treatment to avoid the problematic side effects of radiation. In young children, radiation can cause learning problems as well as reduction in growth.","Biological Bases","Treatment can harm the developing brain.","Late effects of cranial radiation","Radiation to a child's brain can lead to learning problems and cognitive deficits."],["Your expertise is sought to help address theme-interference problems. You would most likely provide:",["client-centered case consultation.","consultee-centered case consultation.","consultee-centered administrative consultation.","program-centered administrative consultation."],1,"In providing consultation, theme-interference problems are problems that the supervisee (or consultee) is experiencing, that can affect patients' progress. Thus, the type of consultation needed in this instance is consultee- centered case consultation.","Treatment and Prevention","Focus on the consultee's difficulty, not the client's.","Consultee-centered case consultation","Caplan's consultation aimed at improving the consultee's skill or objectivity, such as when theme interference blocks their work."],["You are seeing a child with Schizophrenia who needs hospitalization. At a minimum, you should obtain consent from:",["both parents.","one parent.","the legal guardian.","the child."],2,"Consent for the treatment of a minor must always be secured from whoever is the minor's legal guardian. The child should provide assent.","Ethics, Legal, Professional","Think about who has legal authority for a child.","Legal guardian consent","For a minor, the legal guardian gives consent, at minimum."],["Following an incident of spousal abuse, the intervention with the lowest recidivism rate would be:",["imprisoning the perpetrator.","court-ordered group therapy focusing on issues of abuse.","the woman leaving the husband and going to a shelter.","crisis marital counseling."],0,"Unfortunately, there is not only a high incidence of spousal abuse, but there is also a high incidence of repeat offenses. Arrest and imprisonment is the intervention that has been demonstrated to have the greatest likelihood of preventin
